<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brass Table Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --felt:#0F3037; --felt-2:#0A2227; --felt-3:#061518; --felt-hi:#1B4D57;
  --rail:#081417; --rail-2:#0E2227; --line:rgba(216,170,82,.22);
  --brass:#D8AA52; --brass-2:#F0CD85; --brass-dim:rgba(216,170,82,.5);
  --ivory:#F7F2E7; --ink:#15171C; --red:#C22F3B; --back:#6E1F2B;
  --text:#EAE5D7; --muted:#93AAAB; --win:#63D69E; --lose:#F2786D; --push:#D5CDB2; --bj:#F0CD85;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --cw:clamp(40px,5.2vw,64px);
}
html,body{height:100%}
body{background:var(--felt-3);color:var(--text);font-family:var(--body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,var(--brass-2),var(--brass));color:var(--ink);font-size:16px}
.brand small{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--win);display:inline-flex;align-items:center;gap:6px}
.brand small i{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win)}
.bank{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bank .amt{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--brass-2);font-variant-numeric:tabular-nums}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--rail-2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off{color:var(--muted)}

.table{position:relative;overflow-y:auto;overflow-x:hidden;padding:16px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:radial-gradient(120% 95% at 50% -5%,var(--felt-hi) 0%,var(--felt) 38%,var(--felt-2) 74%,var(--felt-3) 100%)}
.dealer{display:flex;flex-direction:column;align-items:center;gap:8px}
.zone-head{display:flex;align-items:center;gap:8px;min-height:26px}
.pill{font:700 12.5px var(--mono);padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.34);border:1px solid var(--line);white-space:nowrap}
.pill.bust{color:var(--lose)} .pill.bj{color:var(--bj);border-color:var(--brass-dim)}
.arc{width:min(680px,100%);height:auto;opacity:.6;pointer-events:none;margin:-4px 0 -10px}
.arc .big{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.14em;fill:var(--brass)}
.arc .small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.24em;fill:var(--brass-2);opacity:.75}
.banner{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:46px}
.banner .t{font:700 16px var(--display);letter-spacing:.01em;color:var(--ivory);text-align:center;text-wrap:balance}
.banner .t b{color:var(--brass-2)}
.tbar{width:200px;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-2));border-radius:9px;width:0}
.tbar.hot i{background:linear-gradient(90deg,#E35F4F,#F2A08A)}

/* cards */
.cards{display:flex;justify-content:center;min-height:calc(var(--cw) * 1.4);padding-inline:2px}
.card{width:var(--cw);height:calc(var(--cw) * 1.4);position:relative;flex:none;border-radius:calc(var(--cw) * .09)}
.cards .card + .card{margin-left:calc(var(--cw) * -.55)}
.dealer .card + .card{margin-left:calc(var(--cw) * -.35)!important}
.dealer .card{--cw:clamp(52px,6.6vw,84px)}
.dealer .cards{min-height:calc(clamp(52px,6.6vw,84px) * 1.4)}
.card.new{animation:deal .38s cubic-bezier(.2,.8,.2,1)}
.card.peek{animation:peek .9s ease}
@keyframes peek{35%{transform:translateY(-14px) rotateX(38deg)}70%{transform:translateY(-14px) rotateX(38deg)}}
.ins{font:800 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:rgba(111,177,214,.16);color:#9FD3F2}
.ins.win{background:rgba(99,214,158,.16);color:var(--win)} .ins.lose{background:rgba(242,120,109,.14);color:var(--lose)}
.btn.insure{background:linear-gradient(180deg,#9FD3F2,#5FA8D3);color:#0B1E22;border-color:transparent;min-width:150px}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-8deg) scale(.8)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--ivory);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 14px rgba(0,0,0,.34)}
.card.red .face{color:var(--red)}
.corner{position:absolute;top:6%;left:9%;display:flex;flex-direction:column;align-items:center;line-height:.95;font:700 calc(var(--cw) * .25) var(--display);letter-spacing:-.04em}
.corner .s{font-size:calc(var(--cw) * .18);letter-spacing:0}
.pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw) * .5);padding-top:14%}
.pip.court span{display:grid;place-items:center;width:50%;height:48%;border-radius:calc(var(--cw) * .06);border:1.5px solid currentColor;font:800 calc(var(--cw) * .32) var(--display)}
.back{position:absolute;inset:0;border-radius:inherit;background-color:var(--back);
  background-image:repeating-linear-gradient(45deg,rgba(240,205,133,.15) 0 1.5px,transparent 1.5px 9px),repeating-linear-gradient(-45deg,rgba(240,205,133,.15) 0 1.5px,transparent 1.5px 9px);
  box-shadow:inset 0 0 0 calc(var(--cw) * .05) var(--ivory),0 6px 14px rgba(0,0,0,.34)}

/* seats */
.seats{width:100%;max-width:1180px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;margin-top:4px}
.seat{--lift:0px;transform:translateY(var(--lift));display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.seat:nth-child(1),.seat:nth-child(5){--lift:-34px} .seat:nth-child(2),.seat:nth-child(4){--lift:-10px}
.hands{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:calc(var(--cw) * 1.4 + 30px);justify-content:flex-end;width:100%}
.hands.many{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;--cw:clamp(30px,3.4vw,44px);gap:4px}
.hands.many .hand{padding:4px}
.hand{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 6px 7px;border-radius:12px;border:1px solid transparent;max-width:100%}
.hand.active{border-color:var(--brass-dim);background:rgba(216,170,82,.08);box-shadow:0 0 22px rgba(216,170,82,.18)}
.meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
.stake{font:700 11.5px var(--mono);color:var(--brass-2)}
.res{font:800 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;animation:pop .3s ease}
.res.win,.res.blackjack{background:rgba(99,214,158,.16);color:var(--win)} .res.blackjack{background:rgba(240,205,133,.18);color:var(--bj)}
.res.lose,.res.bust,.res.dealer{background:rgba(242,120,109,.14);color:var(--lose)} .res.push{background:rgba(213,205,178,.12);color:var(--push)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.plate{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(216,170,82,.18);min-width:0}
.seat.me .plate{border-color:var(--brass);background:rgba(216,170,82,.12)}
.seat.turn .plate{box-shadow:0 0 0 2px var(--brass-2),0 0 26px rgba(240,205,133,.35)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 14px var(--body);color:var(--ink)}
.who{min-width:0;flex:1}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.ok{color:var(--win)}
.bet{font:700 13px var(--mono);color:var(--brass-2);flex:none}
.sit{width:100%;padding:16px 10px;border-radius:14px;border:1.5px dashed var(--brass-dim);background:rgba(0,0,0,.14);cursor:pointer;font:700 13.5px var(--body);color:var(--brass-2);transition:background .2s,border-color .2s}
.sit:hover:not(:disabled){background:rgba(216,170,82,.1);border-color:var(--brass)}
.sit:disabled{cursor:default;color:var(--muted);border-color:rgba(255,255,255,.12)}
.sit small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:2px}

/* controls */
.controls{background:var(--rail);border-top:1px solid var(--line);padding:11px 16px 13px;display:flex;flex-direction:column;gap:10px;align-items:center}
.status{font-size:13.5px;color:var(--muted);text-align:center;min-height:19px}
.status b{color:var(--text)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}
.chip{--c:#E9E4D6;--e:#8A8577;--t:var(--ink);width:52px;height:52px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;flex:none;
  background:radial-gradient(circle,var(--c) 0 55%,transparent 56%),repeating-conic-gradient(var(--e) 0 14deg,var(--c) 14deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22),0 3px 0 rgba(0,0,0,.45),0 7px 14px rgba(0,0,0,.35);display:grid;place-items:center;font:700 12.5px var(--mono);color:var(--t);transition:transform .15s,filter .2s}
.chip::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.chip[data-v="1"]::after{border-color:rgba(0,0,0,.25)}
.chip:hover:not(:disabled){transform:translateY(-3px)}
.chip:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed}
.chip[data-v="5"]{--c:#C22F3B;--e:#F7F2E7;--t:#fff}
.chip[data-v="25"]{--c:#2B8A5A;--e:#F7F2E7;--t:#fff}
.chip[data-v="100"]{--c:#1B1C22;--e:#D8AA52;--t:#F0CD85}
.chip[data-v="500"]{--c:#6A3DA6;--e:#F0CD85;--t:#fff}
.btn{font:700 15px var(--body);padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#10262B;color:var(--text);min-width:88px;display:inline-flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.btn:hover:not(:disabled){background:#16343C}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--brass-2),var(--brass));color:var(--ink);border-color:transparent;min-width:150px}
.btn.ghost{background:transparent}
kbd{font:600 10.5px var(--mono);padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--muted)}
.btn.primary kbd{background:rgba(0,0,0,.12);color:rgba(21,23,28,.7)}
.toast{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:20;text-align:center;pointer-events:none;opacity:0;width:max-content;max-width:92%}
.toast.show{animation:toast 2.3s ease forwards}
.toast .t{font:800 clamp(26px,5.5vw,48px)/1 var(--display);letter-spacing:-.02em;color:var(--brass-2);text-shadow:0 4px 30px rgba(0,0,0,.7)}
.toast.win .t{color:var(--win)} .toast.lose .t{color:var(--lose)} .toast.dim .t{color:var(--push);font-size:clamp(20px,3.6vw,30px)}
.toast .s{margin-top:8px;font:600 14px var(--body);text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.92)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(3,10,12,.8);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.gatecard{width:min(460px,100%);text-align:center;background:#0B1E22;border:1px solid var(--line);border-radius:18px;padding:26px 22px}
.gatecard h2{margin:0 0 8px;font:800 24px var(--display)}
.gatecard p{margin:0 0 16px;color:var(--muted);line-height:1.55;font-size:14.5px}
.gatecard input{width:100%;font:600 18px var(--body);text-align:center;color:var(--text);background:#061518;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.gatecard a{color:var(--brass-2)}
@media (max-width:820px){
  .seats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}
  .seat,.seat:nth-child(n){--lift:0px}
  :root{--cw:clamp(40px,11vw,56px)}
}
@media (max-width:640px){
  .brand span.nm2,.brand small{display:none}
  .btn{min-width:0;padding:11px 12px;font-size:14px}
  .btn kbd{display:none}
  .chip{width:44px;height:44px;font-size:11px} .chip::after{inset:7px}
  .arc .small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.toast.show{animation:none;opacity:1}}
.lobbylink{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(232,193,112,.45);color:#F7DFA3;text-decoration:none;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;flex:none;background:rgba(0,0,0,.2)}
.lobbylink:hover{background:rgba(232,193,112,.14)}
.lobbylink svg{width:15px;height:15px}
@media (max-width:640px){.lobbylink span{display:none}.lobbylink{padding:0 9px}}
</style>

<script>
// A word filter for chat and player names (English and German).
// Text is normalised first (accents, look-alike digits and symbols, repeated letters), so "f.u.u.c.k" or "sch3isse" still match.
'use strict';
const WordFilter = (() => {
  // stems: matched anywhere inside a word
  const STEMS = [
    'fuck', 'fuk', 'fck', 'shit', 'bitch', 'cunt', 'pussy', 'whore', 'slut', 'nigg', 'niga', 'nigr', 'faggot', 'fagot', 'retard', 'wank', 'twat', 'asshole', 'dildo', 'porn', 'jizz', 'hitler',
    'scheis', 'fotze', 'wichs', 'arschloch', 'schwuchtel', 'hurensohn', 'missgeburt', 'fick', 'nutte', 'neger', 'kanake', 'spast', 'behindert', 'schlampe', 'muschi', 'pimmel',
  ];
  // whole words only (these are parts of ordinary words too)
  const WORDS = ['fag', 'fags', 'dick', 'dicks', 'cock', 'cocks', 'kys', 'hure', 'huren', 'arsch', 'cum', 'tits', 'nazi', 'nazis', 'kkk', 'rape', 'raped', 'rapist', 'penis', 'vagina'];
  const MAP = { '0': 'o', '1': 'i', '!': 'i', '|': 'i', '3': 'e', '4': 'a', '@': 'a', '5': 's', '$': 's', '7': 't', '8': 'b', '9': 'g', 'ß': 'ss', 'ä': 'a', 'ö': 'o', 'ü': 'u', '€': 'e', '+': 't' };
  const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[0-9!|@$€+ß]/g, c => MAP[c] || c).replace(/[äöü]/g, c => MAP[c]);
  // the words of a message, each normalised; runs of single letters are joined (catches "f u c k")
  function pieces(text) {
    const n = norm(text);
    const raw = n.split(/[^a-z]+/).filter(Boolean);
    const words = raw.map(w => w.replace(/(.)\1+/g, '$1'));
    const runs = []; let cur = '';
    for (const w of raw) { if (w.length === 1) cur += w; else { if (cur.length >= 3) runs.push(cur); cur = ''; } }
    if (cur.length >= 3) runs.push(cur);
    return { words, runs: runs.map(r => r.replace(/(.)\1+/g, '$1')) };
  }
  const STEMS_D = STEMS.map(s => s.replace(/(.)\1+/g, '$1'));
  function bad(text) {
    const { words, runs } = pieces(text);
    return [...words, ...runs].some(w => WORDS.includes(w) || STEMS_D.some(s => w.includes(s)));
  }
  // chat: hide bad words with stars, keep the rest of the message
  function clean(text) {
    return String(text || '').replace(/[\p{L}\p{N}$@!|€+.*_-]+/gu, tok => (bad(tok) ? '*'.repeat(Math.min(8, tok.length)) : tok));
  }
  return { bad, clean };
})();
/* Miguel's Casino (online): the casino's server keeps every bankroll and decides every game.
   This page only shows a copy of your balance and sends your moves. */
window.CASINO_ONLINE = true;
window.CasinoNet = (() => {
  const SEAT_KEY = 'miguels-casino-seat';
  function seat() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SEAT_KEY)); } catch (e) {}
    if (!s || !s.id || !s.token) {
      const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
      s = { id: 'p-' + hex(12), token: hex(24) };
      try { localStorage.setItem(SEAT_KEY, JSON.stringify(s)); } catch (e) {}
    }
    return s;
  }
  // POST to the casino with this browser's seat; returns { ok, status, body }
  async function api(path, body = {}) {
    const s = seat();
    let r, j = {};
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: s.id, token: s.token }, body)) });
        j = await r.json().catch(() => ({}));
        if (r.status === 429 && attempt < 2) { await new Promise(res => setTimeout(res, 700 * (attempt + 1))); continue; }
        if (r.status === 503 && /opening/i.test(j.error || '') && attempt < 2) { await new Promise(res => setTimeout(res, 2500)); continue; }
        break;
      } catch (e) {

window.CasinoWallet = (() => {
  const START = 100000, CACHE = 'miguels-casino-cache';
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
  const mine = cache && cache.id === CasinoNet.seat().id;
  let bal = mine && Number.isFinite(cache.cents) ? cache.cents : 0;
  let info_ = { peak: mine ? cache.peak || 0 : 0, resets: mine ? cache.resets || 0 : 0 };
  let view = null, onExternal = null, isBusy = () => false;
  const listeners = [];
  const cents = () => bal;
  function bind(v, ext, busy) { view = v; onExternal = ext; if (busy) isBusy = busy; }
  function remember() { try { localStorage.setItem(CACHE, JSON.stringify({ id: CasinoNet.seat().id, cents: bal, peak: info_.peak, resets: info_.resets })); } catch (e) {} }
  // the server just told us the balance
  function _server(c) { bal = c; remember(); listeners.forEach(f => { try { f(c); } catch (e) {} }); }
  // move this page's own balance to match the server (only while nothing is in play)
  function apply(c) {
    if (view && onExternal) { const d = c - view(); if (d) onExternal(d); }

    if (r.ok) { info_ = { peak: r.body.peak, resets: r.body.resets }; if (!isBusy()) apply(r.body.cents); CasinoUI.notice(r.body.notice); CasinoUI.mode(r.body); if (r.body.banned) CasinoUI.suspended(); }

  async function reset() {

    if (r.ok) { info_.resets = r.body.resets; apply(r.body.cents); }
    return r;
  }

  // money only moves on the server now, so these do nothing

  return { cents, bind, sync, pull, add, noteReset, info, refresh, reset, apply, onChange, _server, START };
})();

    })().catch(() => { ready = null; return false; });

})();

  const load = () => { try { return Object.assign({ on: true, vol: 0.8, music: false, mvol: 0.4 }, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return { on: true, vol: 0.8, music: false, mvol: 0.4 }; } };

  }

  let dctx = null;
  function ding() {
    if (!cfg.on || !Base) return;
    try {
      if (!dctx) dctx = new window.AudioContext();
      if (dctx.state !== 'running') return;
      const t = dctx.currentTime;
      [1047, 1319, 1568].forEach((f, i) => { const o = dctx.createOscillator(), g = dctx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.08); g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.08 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.5); o.connect(g).connect(dctx.destination); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.55); });
    } catch (e) {}
  }
  return { get: () => Object.assign({}, cfg), set, ding };
})();

    row.appendChild(btn(s.ready ? 'Ready' : 'Deal me in', 'Space', () => act('ready'), { cls: 'primary', disabled: s.ready || s.bet < st.minBet }));
    row.appendChild(btn('Leave seat', '', () => act('leave'), { cls: 'ghost' }));
    return;
  }
  if (st.phase === 'insurance') {
    if (!s.inRound) { status.textContent = "Dealer shows an ace. You're sitting out this round."; row.appendChild(btn('Leave seat', '', () => act('leave'), { cls: 'ghost' })); return; }
    const h = s.hands[0], nat = h.cards.length === 2 && h.total === 21;
    if (s.ins === null) {
      if (nat) {
        status.innerHTML = `You have <b>blackjack</b> and the dealer shows an ace. Take <b>even money</b> (${fmt(h.bet)} now, guaranteed) or play on for 3 to 2?`;
        row.appendChild(btn(`Even money ${fmtS(h.bet)}`, 'Y', () => act('insurance', { take: true }), { cls: 'insure' }));
        row.appendChild(btn('Play for 3:2', 'N', () => act('insurance', { take: false })));
      } else {
        const cost = h.bet / 2;
        status.innerHTML = `The dealer shows an ace. Insurance costs <b>${fmt(cost)}</b> and pays <b>2 to 1</b> if the dealer has blackjack.`;
        row.appendChild(btn(`Insure ${fmt(cost)}`, 'Y', () => act('insurance', { take: true }), { cls: 'insure', disabled: cost > bank }));
        row.appendChild(btn('No insurance', 'N', () => act('insurance', { take: false })));
      }
    } else status.innerHTML = s.ins === 'even' ? 'Even money taken. Waiting for the other players…' : s.ins > 0 ? `Insured for <b>${fmt(s.ins)}</b>. Waiting for the other players…` : 'No insurance. Waiting for the other players…';
    return;
  }
  const t = st.turn, mine = st.phase === 'playing' && t && t.seat === i;
  if (mine) {
    const h = s.hands[t.hand];
    const two = h.cards.length === 2 && !h.splitAces;
    const pv = c => c.r === 'A' ? 1 : Math.min(10, c.r === 'J' || c.r === 'Q' || c.r === 'K' ? 10 : +c.r);
    const canSplit = two && pv(h.cards[0]) === pv(h.cards[1]) && !h.splitAces && h.bet <= bank;
    status.innerHTML = `Your turn: <b>${h.soft && h.total < 21 ? 'soft ' : ''}${h.total}</b> against the dealer's <b>${st.dealerTotal}</b>`;
    row.appendChild(btn('Hit', 'H', () => act('hit')));
    row.appendChild(btn('Stand', 'S', () => act('stand')));
    row.appendChild(btn('Double', 'D', () => act('double'), { disabled: !two || h.bet > bank }));
    row.appendChild(btn('Split', 'P', () => act('split'), { disabled: !canSplit }));
    row.appendChild(btn('Surrender', 'R', () => act('surrender'), { cls: 'ghost', disabled: !(two && s.hands.length === 1 && !h.fromSplit) }));
    return;
  }

  else if (st.phase === 'dealer') status.textContent = 'Dealer is playing';
  else status.textContent = 'Round over. Bets open in a moment.';
  row.appendChild(btn('Leave seat', '', () => act('leave'), { cls: 'ghost' }));
}
async function addBet(v) {
  if (!v) return;
  if (v > bank) { toast('Not enough in your bankroll', `You have ${fmt(bank)}`, 'dim'); return; }

      <ul>${rows.slice(winners.length ? 1 : 0, 7).filter(r => r !== star).map((r, k) => { const [e, t] = title(r, rows.indexOf(r), rows); return `<li class="${r.p === myHash ? 'me' : ''}" style="animation-delay:${0.08 * k + 0.15}s"><span class="e" title="${t}">${e}</span><span class="n">${esc(r.name)}${r.p === myHash ? ' (you)' : ''}<small>${t}</small></span><span class="v ${r.net > 0 ? 'w' : r.net < 0 ? 'l' : 'z'}">${r.net ? money(r.net) : '$0'}</span></li>`; }).join('')}${rows.length > 7 ? `<li><span class="e">…</span><span class="n">${rows.length - 7} more</span><span></span></li>` : ''}</ul>
      <div class="ft"><span>${winners.length} won · ${losers.length} lost</span><span>table ${sum >= 0 ? '+' : '−'}$${(Math.abs(sum) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 })}</span></div>`;
    el.onclick = () => { el.classList.add('out'); setTimeout(() => el.remove(), 350); };
    document.body.appendChild(el); recapEl = el;
    if (winners.length) { const b = el.querySelector('.av').getBoundingClientRect(); confetti(b.left + b.width / 2, b.top + b.height / 2); }
    clearTimeout(recapT); recapT = setTimeout(() => { if (el.isConnected) { el.classList.add('out'); setTimeout(() => el.remove(), 350); } }, 7500);
    // and a short line in the chat history
    const d = document.createElement('div'); d.className = 'm sys recap';
    d.textContent = `${ICON[R.room] || '🎲'} ` + rows.slice(0, 4).map(r => `${r.name} ${r.net ? money(r.net) : '$0'}`).join(' · ') + (rows.length > 4 ? ` · +${rows.length - 4}` : '');
    list.querySelectorAll('.m.empty').forEach(x => x.remove());
    list.appendChild(d); while (list.children.length > 80) list.firstChild.remove();
    if (open) list.scrollTop = list.scrollHeight;
  }
  let es = null;
  function connect() {
    const s = CasinoNet.seat();
    es = new EventSource(`api/chat/stream?room=${ROOM}&id=${encodeURIComponent(s.id)}&token=${encodeURIComponent(s.token)}`);
    es.addEventListener('history', e => { list.innerHTML = ''; let h = []; try { h = JSON.parse(e.data); } catch (x) {} if (!h.length) { sys('No messages yet. Say hi to the table.'); list.lastChild.classList.add('empty'); } h.forEach(m => list.appendChild(line(m))); list.scrollTop = list.scrollHeight; });
    es.addEventListener('msg', e => { try { append(JSON.parse(e.data)); } catch (x) {} });
    es.addEventListener('react', e => { try { const r = JSON.parse(e.data); fly(r.e, r.name); } catch (x) {} });
    es.addEventListener('clear', () => { list.innerHTML = ''; sys('The casino cleared the chat.'); });
    es.addEventListener('recap', e => { try { showRecap(JSON.parse(e.data)); } catch (x) { console.error(x); } });
    es.addEventListener('del', e => { try { const id = JSON.parse(e.data).id; const el = list.querySelector(`[data-id="${id}"]`); if (el) el.remove(); } catch (x) {} });
  }
  function showErr(t) { err.textContent = t; err.hidden = !t; if (t) setTimeout(() => { if (err.textContent === t) { err.hidden = true; } }, 4000); }
  box.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    if (window.WordFilter && WordFilter.bad(WordFilter.clean(text))) { showErr('Keep the chat friendly. That message wasn’t sent.'); return; }
    const r = await CasinoNet.api('api/chat', { room: ROOM, text });
    if (r.ok) { input.value = ''; showErr(''); } else showErr(r.body.error || 'Not sent. Try again.');
  });
  box.querySelector('.reacts').addEventListener('click', async e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    const r = await CasinoNet.api('api/chat', { room: ROOM, react: b.dataset.e });
    if (!r.ok && r.status !== 429) showErr(r.body.error || '');
  });
  // stop the game's own keyboard shortcuts while typing
  input.addEventListener('keydown', e => e.stopPropagation());
  connect();
})();
