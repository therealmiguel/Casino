<script>
// A word filter for chat and player names (English and German).
// Text is normalised first (accents, look-alike digits and symbols, repeated letters), so "f.u.u.c.k" or "sch3isse" still match.
'use strict';
const WordFilter = (() => {
  // stems: matched anywhere inside a word
  const STEMS = [
    'fuck', 'fuk', 'fck', 'shit', 'bitch', 'cunt', 'pussy', 'whore', 'slut', 'nigg', 'niga', 'nigr', 'faggot', 'fagot', 'retard', 'wank', 'twat', 'asshole', 'dildo', 'porn', 'jizz', 'hitler',
    'scheis', 'fotze', 'wichs', 'arschloch', 'schwuchtel', 'hurensohn', 'missgeburt', 'fick', 'nutte', 'neger', 'kanake', 'spast', 'behindert', 'schlampe', 'muschi', 'pimmel',
  ];
  // whole words only (these are parts of ordinary words too)
  const WORDS = ['fag', 'fags', 'dick', 'dicks', 'cock', 'cocks', 'kys', 'hure', 'huren', 'arsch', 'cum', 'tits', 'nazi', 'nazis', 'kkk', 'rape', 'raped', 'rapist', 'penis', 'vagina'];
  const MAP = { '0': 'o', '1': 'i', '!': 'i', '|': 'i', '3': 'e', '4': 'a', '@': 'a', '5': 's', '$': 's', '7': 't', '8': 'b', '9': 'g', 'ß': 'ss', 'ä': 'a', 'ö': 'o', 'ü': 'u', '€': 'e', '+': 't' };
  const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[0-9!|@$€+ß]/g, c => MAP[c] || c).replace(/[äöü]/g, c => MAP[c]);
  // the words of a message, each normalised; runs of single letters are joined (catches "f u c k")
  function pieces(text) {
    const n = norm(text);
    const raw = n.split(/[^a-z]+/).filter(Boolean);
    const words = raw.map(w => w.replace(/(.)\1+/g, '$1'));
    const runs = []; let cur = '';
    for (const w of raw) { if (w.length === 1) cur += w; else { if (cur.length >= 3) runs.push(cur); cur = ''; } }
    if (cur.length >= 3) runs.push(cur);
    return { words, runs: runs.map(r => r.replace(/(.)\1+/g, '$1')) };
  }
  const STEMS_D = STEMS.map(s => s.replace(/(.)\1+/g, '$1'));
  function bad(text) {
    const { words, runs } = pieces(text);
    return [...words, ...runs].some(w => WORDS.includes(w) || STEMS_D.some(s => w.includes(s)));
  }
  // chat: hide bad words with stars, keep the rest of the message
  function clean(text) {
    return String(text || '').replace(/[\p{L}\p{N}$@!|€+.*_-]+/gu, tok => (bad(tok) ? '*'.repeat(Math.min(8, tok.length)) : tok));
  }
  return { bad, clean };
})();
/* Miguel's Casino (online): the casino's server keeps every bankroll and decides every game.
   This page only shows a copy of your balance and sends your moves. */
window.CASINO_ONLINE = true;
window.CasinoNet = (() => {
  const SEAT_KEY = 'miguels-casino-seat';
  function seat() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SEAT_KEY)); } catch (e) {}
    if (!s || !s.id || !s.token) {
      const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
      s = { id: 'p-' + hex(12), token: hex(24) };
      try { localStorage.setItem(SEAT_KEY, JSON.stringify(s)); } catch (e) {}
    }
    return s;
  }
  // POST to the casino with this browser's seat; returns { ok, status, body }
  async function api(path, body = {}) {
    const s = seat();
    let r, j = {};
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: s.id, token: s.token }, body)) });
        j = await r.json().catch(() => ({}));
        if (r.status === 429 && attempt < 2) { await new Promise(res => setTimeout(res, 700 * (attempt + 1))); continue; }
        if (r.status === 503 && /opening/i.test(j.error || '') && attempt < 2) { await new Promise(res => setTimeout(res, 2500)); continue; }
        break;
      } catch (e) {
        if (attempt === 2) return { ok: false, status: 0, body: { error: 'No connection to the casino. Check your internet and try again.' } };
        await new Promise(res => setTimeout(res, 800));
      }
    }
    if (typeof j.cents === 'number') CasinoWallet._server(j.cents);
    if (Array.isArray(j.pop) && j.pop.length) {
      const hype = j.pop.filter(p => p.type === 'hype'), rest = j.pop.filter(p => p.type !== 'hype');
      if (rest.length) CasinoUI.popups(rest);
      if (window.CasinoVoice) {
        const delay = window.CASINO_CTX === 'lobby' || !window.CASINO_CTX ? 300 : 2400;
        hype.forEach(h => setTimeout(() => { CasinoVoice.win(h.x, h.tags || []); if (window.CasinoPolish) CasinoPolish.bigWin(h.x, h.net); }, delay));
        if (rest.length) setTimeout(() => CasinoVoice.pops(rest), delay + (hype.length ? 2800 : 200));
      }
    }
    if (j.wheel && window.CasinoWheel) CasinoWheel.offer(j.wheel);
    if (r.status === 403 && /suspended/i.test(j.error || '')) CasinoUI.suspended();
    return { ok: r.ok, status: r.status, body: j };
  }
  return { seat, api };
})();

window.CasinoWallet = (() => {
  const START = 100000, CACHE = 'miguels-casino-cache';
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
  const mine = cache && cache.id === CasinoNet.seat().id;
  let bal = mine && Number.isFinite(cache.cents) ? cache.cents : 0;
  let info_ = { peak: mine ? cache.peak || 0 : 0, resets: mine ? cache.resets || 0 : 0 };
  let view = null, onExternal = null, isBusy = () => false;
  const listeners = [];
  const cents = () => bal;
  function bind(v, ext, busy) { view = v; onExternal = ext; if (busy) isBusy = busy; }
  function remember() { try { localStorage.setItem(CACHE, JSON.stringify({ id: CasinoNet.seat().id, cents: bal, peak: info_.peak, resets: info_.resets })); } catch (e) {} }
  // the server just told us the balance
  function _server(c) { bal = c; remember(); listeners.forEach(f => { try { f(c); } catch (e) {} }); }
  // move this page's own balance to match the server (only while nothing is in play)
  function apply(c) {
    if (view && onExternal) { const d = c - view(); if (d) onExternal(d); }
    _server(c);
  }
  async function refresh() {
    if (isBusy()) return null;
    const r = await CasinoNet.api('api/me', { name: CasinoBoard.name(), ctx: window.CASINO_CTX || 'lobby' });
    if (r.ok) { info_ = { peak: r.body.peak, resets: r.body.resets }; if (!isBusy()) apply(r.body.cents); CasinoUI.notice(r.body.notice); CasinoUI.mode(r.body); if (r.body.banned) CasinoUI.suspended(); }
    return r.ok ? r.body : null;
  }
  // a fresh $1,000, only when you are out of chips everywhere
  async function reset() {
    const r = await CasinoNet.api('api/wallet/reset');
    if (r.ok) { info_.resets = r.body.resets; apply(r.body.cents); }
    return r;
  }
  const info = () => ({ cents: bal, peak: Math.max(info_.peak || 0, bal), resets: info_.resets || 0 });
  const onChange = f => listeners.push(f);
  let last = 0;
  const maybeRefresh = () => { if (Date.now() - last > 4000) { last = Date.now(); refresh(); } };
  addEventListener('focus', maybeRefresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) maybeRefresh(); });
  // money only moves on the server now, so these do nothing
  const sync = () => {}, pull = () => {}, add = () => {}, noteReset = () => {};
  return { cents, bind, sync, pull, add, noteReset, info, refresh, reset, apply, onChange, _server, START };
})();

window.CasinoBoard = (() => {
  const NAME_KEY = 'miguels-casino-name';
  let ready = null, mode = null, denied = false, meInfo = null, timer = null;
  function name() { try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; } }
  function setName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} push(); }
  function connect() {
    if (ready) return ready;
    ready = (async () => {
      if (!/^https?:$/.test(location.protocol)) return false;
      const r = await CasinoNet.api('api/me', { name: name(), ctx: window.CASINO_CTX || 'lobby' });
      if (!r.ok) { if (r.status === 403) { denied = true; mode = 'server'; return true; } ready = null; return false; }
      meInfo = r.body; mode = 'server';
      CasinoWallet.apply(r.body.cents);
      CasinoUI.notice(r.body.notice);
      CasinoUI.mode(r.body);
      if (r.body.banned) CasinoUI.suspended();
      if (r.body.name && !name()) { try { localStorage.setItem(NAME_KEY, r.body.name); } catch (e) {} }
      return true;
    })().catch(() => { ready = null; return false; });
    return ready;
  }
  async function push() {
    if (!(await connect())) return false;
    const r = await CasinoNet.api('api/me', { name: name(), ctx: window.CASINO_CTX || 'lobby' });
    if (r.ok) meInfo = r.body;
    if (r.ok && r.body.nameError) { try { localStorage.setItem(NAME_KEY, r.body.name || ''); } catch (e) {} dispatchEvent(new CustomEvent('casino:nameError', { detail: r.body.nameError })); }
    return r.ok;
  }
  function schedule(ms = 2500) { clearTimeout(timer); timer = setTimeout(push, ms); }
  function subscribe(onRows, onError) {
    let es = null, poll = null;
    const load = () => fetch('api/players', { cache: 'no-store' }).then(r => r.json()).then(onRows).catch(() => {});
    if (window.EventSource) {
      es = new EventSource('api/stream');
      es.addEventListener('players', e => { try { onRows(JSON.parse(e.data)); } catch (x) {} });
      es.addEventListener('notice', e => { try { CasinoUI.notice(JSON.parse(e.data)); } catch (x) {} });
      es.addEventListener('jackpot', e => { try { dispatchEvent(new CustomEvent('casino:jackpot', { detail: JSON.parse(e.data) })); } catch (x) {} });
      es.addEventListener('wheel', () => { if (window.CasinoWheel) CasinoWheel.check(); });
      es.addEventListener('feed', e => { try { dispatchEvent(new CustomEvent('casino:feed', { detail: { items: JSON.parse(e.data), fresh: true } })); } catch (x) {} });
      es.addEventListener('feedall', e => { try { dispatchEvent(new CustomEvent('casino:feed', { detail: { items: JSON.parse(e.data), fresh: false } })); } catch (x) {} });
      es.onerror = () => { if (onError && es.readyState === 2) onError(); };
    } else { load(); poll = setInterval(load, 8000); }
    return () => { if (es) es.close(); if (poll) clearInterval(poll); };
  }
  const identity = () => CasinoNet.seat();
  const snapshot = () => null;
  return { name, setName, connect, push, schedule, snapshot, subscribe, identity, get uid() { return CasinoNet.seat().id; }, get mode() { return mode; }, get denied() { return denied; }, get me() { return meInfo; } };
})();

// announcements from the casino, and the notice for a suspended account
window.CasinoUI = (() => {
  let bar = null, shownKey = '';
  const css = `.mc-notice{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;max-width:min(680px,calc(100% - 24px));display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:14px;
    font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1B1206;background:linear-gradient(180deg,#FFE9A8,#F2C65A);box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);animation:mcIn .35s ease}
    .mc-notice.party{background:linear-gradient(90deg,#FF9AD5,#FFD36E,#8EF0B4);} .mc-notice.warn{background:linear-gradient(180deg,#FFB4A8,#F2786D);}
    .mc-notice.ban{background:linear-gradient(180deg,#3A1414,#220A0A);color:#FFD9D2;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px #F2786D}
    .mc-notice b{font-weight:800}
    .mc-pops{position:fixed;left:14px;bottom:14px;z-index:9998;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(340px,calc(100% - 28px))}
    .mc-pop{display:flex;gap:11px;align-items:center;padding:11px 14px 11px 11px;border-radius:14px;background:linear-gradient(180deg,#2A1B10,#170E08);color:#FFF4DA;box-shadow:0 0 0 1px rgba(247,223,163,.5),0 14px 34px rgba(0,0,0,.55);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;animation:mcPop .45s cubic-bezier(.2,1.3,.4,1);pointer-events:auto}
    .mc-pop i{font-style:normal;font-size:26px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(247,223,163,.12);flex:none}
    .mc-pop b{display:block;font-weight:800;color:#F7DFA3}
    .mc-pop small{display:block;color:#D8C8A8;font-size:12.5px}
    .mc-pop.out{animation:mcOut .35s ease forwards}
    @keyframes mcPop{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
    @keyframes mcOut{to{opacity:0;transform:translateX(-30px)}}
    .mc-tour{position:fixed;left:12px;bottom:110px;pointer-events:none;white-space:nowrap;z-index:9997;padding:7px 12px;border-radius:999px;font:800 11.5px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#1B1206;background:linear-gradient(90deg,#8EF0B4,#F2C65A);box-shadow:0 8px 20px rgba(0,0,0,.4)}
    .mc-notice button{flex:none;border:0;background:rgba(0,0,0,.14);color:inherit;width:26px;height:26px;border-radius:50%;cursor:pointer;font:700 15px system-ui}
    @keyframes mcIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}`;
  function ensure() {
    if (bar) return bar;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    bar = document.createElement('div'); bar.className = 'mc-notice'; bar.hidden = true; bar.setAttribute('role', 'status');
    document.body.appendChild(bar);
    return bar;
  }
  function show(text, kind, closable) {
    const b = ensure();
    b.className = 'mc-notice ' + (kind || '');
    b.textContent = '';
    const s = document.createElement('span'); s.textContent = text; b.appendChild(s);
    if (closable) { const x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.textContent = '×'; x.onclick = () => { b.hidden = true; try { sessionStorage.setItem('mc-notice-closed', shownKey); } catch (e) {} }; b.appendChild(x); }
    b.hidden = false;
  }
  let banned = false;
  function notice(n) {
    if (banned) return;
    if (!document.body) { addEventListener('DOMContentLoaded', () => notice(n)); return; }
    if (!n || !n.text) { if (bar && !banned) bar.hidden = true; return; }
    shownKey = String(n.t || n.text);
    let closed = ''; try { closed = sessionStorage.getItem('mc-notice-closed') || ''; } catch (e) {}
    if (closed === shownKey) return;
    show('📣 ' + n.text, n.kind === 'party' ? 'party' : n.kind === 'warn' ? 'warn' : '', true);
  }
  function suspended() {
    banned = true;
    if (!document.body) { addEventListener('DOMContentLoaded', suspended); return; }
    show('Your account has been suspended by the casino, so you can’t play right now. Ask Miguel if you think this is a mistake.', 'ban', false);
  }
  // achievements, level ups, gifts: little cards in the corner, a moment after the result is on screen
  let popBox = null, queue = [], showing = 0;
  function popups(list) {
    if (!document.body) { addEventListener('DOMContentLoaded', () => popups(list)); return; }
    ensure();
    if (!popBox) { popBox = document.createElement('div'); popBox.className = 'mc-pops'; popBox.setAttribute('aria-live', 'polite'); document.body.appendChild(popBox); }
    const delay = window.CASINO_CTX === 'lobby' || !window.CASINO_CTX ? 300 : 2600;
    list.forEach((p, i) => setTimeout(() => showPop(p), delay + i * 900));
  }
  function showPop(p) {
    const el = document.createElement('div'); el.className = 'mc-pop';
    const ic = document.createElement('i'); ic.textContent = p.icon || '⭐';
    const tx = document.createElement('div'); const b = document.createElement('b'); b.textContent = (p.type === 'ach' ? 'Badge unlocked · ' : '') + p.title; const sm = document.createElement('small'); sm.textContent = p.text || '';
    tx.append(b, sm); el.append(ic, tx); popBox.appendChild(el);
    try { if (window.CasinoSound) CasinoSound.ding(); } catch (e) {}
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 5200);
  }
  // playing with tournament chips: say so on every solo table
  let ribbon = null;
  function mode(me) {
    if (!document.body) { addEventListener('DOMContentLoaded', () => mode(me)); return; }
    const on = me && me.mode === 'tour' && window.CASINO_CTX === 'solo';
    if (on && !ribbon) { ensure(); ribbon = document.createElement('div'); ribbon.className = 'mc-tour'; ribbon.textContent = '🏁 Tournament chips'; ribbon.title = 'You are playing with this week’s tournament chips. Switch back in the lobby.'; document.body.appendChild(ribbon); }
    if (ribbon) ribbon.hidden = !on;
  }
  return { notice, suspended, popups, mode };
})();

// one volume for every game, and soft lounge music if you want it (set in the lobby)
window.CasinoSound = (() => {
  const KEY = 'miguels-casino-sound';
  const DEF = { on: true, vol: 0.8, music: true, mvol: 0.45, style: 'mix', voice: true, vvol: 0.9, v: 2 };
  const load = () => {
    let c = null; try { c = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!c) return Object.assign({}, DEF);
    // settings saved before the new music came out: switch the music and the announcer on once
    if (c.v !== 2) Object.assign(c, { music: true, mvol: Math.max(c.mvol || 0, 0.45), style: 'mix', voice: true, vvol: 0.9, v: 2 });
    return Object.assign({}, DEF, c);
  };
  let cfg = load();
  const masters = new Set();
  const level = () => (cfg.on ? cfg.vol : 0);

/* The announcer: a voice that calls out big wins, bonuses, level ups and the Casino Wheel. */
window.CasinoVoice = (() => {
  const synth = window.speechSynthesis;
  let voice = null, lastAt = 0, lastDj = Date.now(), unlocked = false;
  const recent = [];
  function pickVoice() {
    if (!synth) return null;
    const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
    if (!vs.length) return null;
    const like = [/Google UK English Male/i, /Microsoft (Guy|Andrew|Christopher|Davis|Ryan|Brian|Eric)/i, /\b(Daniel|Aaron|Alex|Arthur|Fred|Rishi|Oliver)\b/i, /Google US English/i, /male/i];
    for (const re of like) { const v = vs.find(x => re.test(x.name)); if (v) return v; }
    return vs.find(v => /en-US|en-GB/i.test(v.lang)) || vs[0];
  }
  if (synth) { voice = pickVoice(); synth.addEventListener && synth.addEventListener('voiceschanged', () => { voice = pickVoice(); }); }
  const enabled = () => { const c = CasinoSound.get(); return !!synth && c.on && c.voice !== false; };
  const pickLine = list => { const fresh = list.filter(l => !recent.includes(l)); const l = (fresh.length ? fresh : list)[Math.floor(Math.random() * (fresh.length || list.length))]; recent.push(l); if (recent.length > 6) recent.shift(); return l; };
  function say(text, o = {}) {
    if (!enabled() || !text) return false;
    const now = Date.now();
    if (!o.force && now - lastAt < 2500) return false;
    lastAt = now;
    try {
      if (o.force) synth.cancel();
      const u = new SpeechSynthesisUtterance(text), c = CasinoSound.get();
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = o.rate || 1.06; u.pitch = o.pitch || 0.92; u.volume = Math.max(0, Math.min(1, (c.vvol ?? 0.9) * Math.max(0.4, c.vol)));
      u.onstart = () => CasinoMusic.duck(true); u.onend = u.onerror = () => CasinoMusic.duck(false);
      synth.speak(u);
      return true;
    } catch (e) { return false; }
  }
  const L = {
    jackpot: ['Jackpot! Unbelievable!', 'Jackpot! What a hit!', 'Jackpot! Ladies and gentlemen, we have a jackpot!'],
    epic: ['Epic win!', 'Absolutely legendary!', 'Off the charts!'],
    mega: ['Mega win!', 'Massive win!', 'Oh, that is huge!'],
    big: ['Big win!', 'Big win, let’s go!', 'Now that’s a win!'],
    nice: ['Nice win!', 'Nice one!', 'Winner!'],
    blackjack: ['Blackjack!', 'Blackjack! Twenty one!'],
    freespins: ['Free spins!', 'Bonus time! Free spins!'],
    bonus: ['Bonus!', 'Bonus round!'],
    grand: ['The Grand! Incredible!'],
    lightning: ['Lightning strikes!'],
    level: ['Level up!', 'Level up! Nice!'],
    badge: ['Badge unlocked!'],
    wheel: ['Spin the wheel! Everybody gets a spin!', 'It’s wheel time! Spin to win!'],
    wheelTop: ['The top prize! Unbelievable!'],
    trophy: ['Congratulations, champion!'],
    welcome: ['Welcome to Miguel’s Casino!', 'Welcome back to Miguel’s Casino!'],
    dj: ['Miguel’s Casino!', 'Let’s go!', 'Turn it up!', 'Here we go!', 'Feel the vibe!', 'Make some noise!'],
    wizard: ['You win! All hail the Archmage!', 'Victory! Well played!'],
    tableWin: ['Winner!', 'Nice hand!', 'You got it!'],
  };
  function line(kind, o) { const l = L[kind]; if (!l) return false; return say(pickLine(l), o); }
  // a result came in: x = paid ÷ staked
  function win(x, tags = []) {
    let kind = null, big = false;
    if (tags.includes('grand')) { kind = 'grand'; big = true; }
    else if (tags.includes('lightning-500')) kind = 'lightning';
    else if (x >= 100) { kind = 'epic'; big = true; }
    else if (x >= 25) { kind = 'mega'; big = true; }
    else if (x >= 10) kind = 'big';
    else if (tags.includes('free-spins')) kind = 'freespins';
    else if (tags.includes('natural')) kind = 'blackjack';
    else if (tags.includes('hold-blast') || tags.includes('bonus')) kind = 'bonus';
    else if (x >= 5) kind = 'nice';
    if (!kind) return;
    if (x >= 10 || big) CasinoMusic.fanfare(big);
    line(kind, { force: x >= 10 || big });
  }
  // the casino's little corner cards
  function pops(list) {
    for (const p of list) {
      if (p.type === 'ach' && /jackpot/i.test(p.title)) { CasinoMusic.fanfare(true); return line('jackpot', { force: true }); }
      if (p.type === 'level') return line('level');
      if (p.type === 'trophy') return line('trophy');
      if (p.type === 'ach') return line('badge');
    }
  }
  function dj() {
    const c = CasinoSound.get();
    if (!c.music || Date.now() - lastDj < 100000 || Math.random() > 0.6) return;

  }
  document.addEventListener('pointerdown', unlock, { once: false }); document.addEventListener('keydown', unlock);
  return { say, line, win, pops, dj, available: !!synth };
})();

  }`;
  function style() { if (document.getElementById('mc-polish')) return; const s = document.createElement('style'); s.id = 'mc-polish'; s.textContent = css; (document.head || document.documentElement).appendChild(s); }
  style();
  const usd = c => '+$' + (Math.abs(c) / 100).toLocaleString('en-US', { minimumFractionDigits: Math.abs(c) % 100 ? 2 : 0, maximumFractionDigits: 2 });
  // slot pages have their own big win screens
  const ownScreens = /\/(slots|cascade|book)\.html/i.test(location.pathname);
  let last = 0;
  function bigWin(x, net, opts = {}) {
    if (!document.body || (ownScreens && !opts.force) || !(x >= 10) || Date.now() - last < 3500) return;
    last = Date.now();
    const title = x >= 100 ? 'Epic win' : x >= 25 ? 'Mega win' : 'Big win';
    const el = document.createElement('div'); el.className = 'mcw-win' + (x >= 25 ? ' epic' : ''); el.setAttribute('role', 'status');
    el.innerHTML = `<small>${(Math.round(x * 100) / 100).toLocaleString('en-US')}× your bet</small><b>${title}</b>${net > 0 ? `<span>${usd(net)}</span>` : ''}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 3500);
    const n = x >= 25 ? 46 : 26;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i'); c.className = 'mcw-coin';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.setProperty('--dx', (Math.random() - 0.5) * 160 + 'px'); c.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
      c.style.setProperty('--t', (1.6 + Math.random() * 1.2) + 's'); c.style.setProperty('--d', (Math.random() * 0.7) + 's');
      const s = 12 + Math.random() * 10; c.style.width = c.style.height = s + 'px';
      document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
    }
  }
  return { bigWin };
})();
</script>

<script>
/* Big games: drawing match cards and schedule rows (shared by the lobby and the schedule page). */
window.BigGames = (() => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ICON = { football: '⚽', basketball: '🏀', 'american-football': '🏈', hockey: '🏒', baseball: '⚾', f1: '🏎️', tennis: '🎾' };
  const SPORT = { football: 'Football', basketball: 'Basketball', 'american-football': 'American football', hockey: 'Ice hockey', baseball: 'Baseball', f1: 'Formula 1', tennis: 'Tennis' };
  const tf = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit' });
  const df = new Intl.DateTimeFormat([], { weekday: 'short', day: 'numeric', month: 'short' });
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
  function dayName(t) {
    const today = new Date(), d = new Date(t);
    const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    return diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : df.format(d);
  }
  function when(e) {
    if (e.state === 'in') return `<span class="bg-live"><i></i>Live${e.detail ? ' · ' + esc(e.detail) : ''}</span>`;
    if (e.state === 'post') return `<span class="bg-ft">${esc(e.detail || 'Final')}</span>`;
    const left = e.start - Date.now();
    if (left > 0 && left < 3 * 3600000) { const m = Math.round(left / 60000); return `<span class="bg-soon">in ${m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'}</span>`; }
    return `<span>${dayName(e.start)}, ${tf.format(new Date(e.start))}</span>`;
  }
  const crest = t => t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : `<b class="bg-ini">${esc((t.abbr || t.short || '?').slice(0, 3))}</b>`;
  const showScore = e => e.state !== 'pre' && e.home && e.home.score !== '';
  // a big card for the featured strip
  function card(e) {
    if (e.kind === 'race') {
      return `<article class="bg-card race"><header><span>${ICON.f1} ${esc(e.league)}</span>${when(e)}</header>
        <div class="bg-race"><b>${esc(e.session)}</b><span>${esc(e.title)}</span></div>
        ${e.podium && e.podium.length ? `<ol class="bg-pod">${e.podium.map(p => `<li>${crest(p)}${esc(p.short)}</li>`).join('')}</ol>` : `<p class="bg-venue">${esc(e.venue)}</p>`}</article>`;
    }
    const sc = showScore(e);
    return `<article class="bg-card${e.state === 'in' ? ' is-live' : ''}"><header><span>${ICON[e.sport] || ''} ${esc(e.league)}</span>${when(e)}</header>
      <div class="bg-vs">
        <div class="bg-t${e.state === 'post' && e.home.winner ? ' won' : ''}">${crest(e.home)}<span>${esc(e.home.short)}</span></div>
        <div class="bg-mid">${sc ? `<b>${esc(e.home.score)}</b><i>–</i><b>${esc(e.away.score)}</b>` : `<i>vs</i>`}</div>
        <div class="bg-t${e.state === 'post' && e.away.winner ? ' won' : ''}">${crest(e.away)}<span>${esc(e.away.short)}</span></div>
      </div>
      <p class="bg-venue">${esc(e.round || e.note || e.venue || '')}</p></article>`;
  }
  // a line in the full schedule
  function row(e) {
    if (e.kind === 'race') {
      return `<li class="bg-row race${e.state === 'in' ? ' is-live' : ''}"><span class="bg-time">${e.state === 'pre' ? tf.format(new Date(e.start)) : when(e)}</span>
        <span class="bg-rname"><b>${esc(e.session)}</b> ${esc(e.title)}</span><span class="bg-rpod">${(e.podium || []).map((p, i) => `${['🥇', '🥈', '🥉'][i]} ${esc(p.short)}`).join(' ')}</span></li>`;
    }
    const sc = showScore(e);
    const nm = t => `<span class="nm"><span class="f">${esc(t.name)}</span><span class="sh">${esc(t.short)}</span></span>`;
    const time = e.state === 'pre' ? tf.format(new Date(e.start)) : e.state === 'in' ? `<span class="bg-live"><i></i>${esc(e.detail || 'Live')}</span>` : esc(e.detail || 'Final');
    return `<li class="bg-row${e.state === 'in' ? ' is-live' : ''}"><span class="bg-time">${time}</span>
      <span class="bg-h${e.state === 'post' && e.home.winner ? ' won' : ''}">${nm(e.home)}${crest(e.home)}</span>
      <span class="bg-s">${sc ? `${esc(e.home.score)}<i>–</i>${esc(e.away.score)}` : '<i>vs</i>'}</span>
      <span class="bg-a${e.state === 'post' && e.away.winner ? ' won' : ''}">${crest(e.away)}${nm(e.away)}</span>
      <span class="bg-extra">${esc(e.round || (e.tv && e.tv.length ? e.tv.join(', ') : ''))}</span></li>`;
  }
  const css = `
  .bg-card{flex:none;width:250px;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:18px;color:var(--ivory,#F5EBDD);
    background:radial-gradient(120% 80% at 50% 0%,rgba(255,240,200,.07),transparent 60%),linear-gradient(180deg,#1F0C15,#160810);box-shadow:0 0 0 1px rgba(232,193,112,.2),0 14px 30px rgba(0,0,0,.4)}
  .bg-card.is-live{box-shadow:0 0 0 1px rgba(91,208,138,.55),0 14px 30px rgba(0,0,0,.4),0 0 28px rgba(91,208,138,.12)}
  .bg-card header{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted,#B69C9F)}
  .bg-card header>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bg-card header>span:last-child{flex:none;color:var(--gold,#E8C170)}
  .bg-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
  .bg-t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:13.5px;line-height:1.2;min-width:0}
  .bg-t span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bg-t.won span{color:var(--gold-2,#F7DFA3)}
  .bg-t img,.bg-t .bg-ini{width:44px;height:44px;object-fit:contain}
  .bg-ini{display:inline-grid;place-items:center;border-radius:50%;background:rgba(232,193,112,.12);color:var(--gold-2,#F7DFA3);font:700 12px var(--body,system-ui)}
  .bg-mid{display:flex;align-items:center;gap:6px;font:500 26px var(--mono,ui-monospace,monospace);color:var(--gold-2,#F7DFA3);font-variant-numeric:tabular-nums}
  .bg-mid i{font-style:normal;color:var(--muted,#B69C9F);font-size:15px}
  .bg-venue{margin:0;font-size:12px;color:var(--muted,#B69C9F);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.2em}
  .bg-live{display:inline-flex;align-items:center;gap:6px;color:#7FE3A8!important;font-weight:600}
  .bg-live i{width:7px;height:7px;border-radius:50%;background:#5BD08A;box-shadow:0 0 8px #5BD08A;animation:bgPulse 1.4s ease-in-out infinite}
  @keyframes bgPulse{50%{opacity:.35}}
  .bg-ft{color:var(--muted,#B69C9F)!important}
  .bg-soon{color:#FFD58A!important;font-weight:600}
  .bg-race b{display:block;font:400 22px/1.1 var(--display,Georgia,serif);color:var(--gold-2,#F7DFA3)}
  .bg-race span{font-size:13.5px}
  .bg-pod{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
  .bg-pod li{display:flex;align-items:center;gap:8px}
  .bg-pod img,.bg-pod .bg-ini{width:18px;height:18px;object-fit:contain}
  .bg-row{display:grid;grid-template-columns:90px minmax(0,1fr) 64px minmax(0,1fr) 140px;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(232,193,112,.1);font-size:14.5px}
  .bg-row.is-live{background:linear-gradient(90deg,rgba(91,208,138,.08),transparent 70%)}
  .bg-time{font:500 13px var(--mono,ui-monospace,monospace);color:var(--muted,#B69C9F)}
  .bg-h,.bg-a{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
  .bg-h{justify-content:flex-end;text-align:right}
  .bg-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bg-row .nm .sh{display:none}
  .bg-h img,.bg-a img,.bg-row .bg-ini{width:24px;height:24px;object-fit:contain;flex:none}
  .bg-row .bg-ini{font-size:9px}
  .bg-h.won,.bg-a.won{color:var(--gold-2,#F7DFA3);font-weight:600}
  .bg-s{text-align:center;font:500 16px var(--mono,ui-monospace,monospace);color:var(--gold-2,#F7DFA3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bg-s i{font-style:normal;color:var(--muted,#B69C9F);margin:0 4px;font-size:13px}
  .bg-extra{font-size:12px;color:var(--muted,#B69C9F);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bg-row.race{grid-template-columns:90px minmax(0,1fr) auto}
  .bg-rname b{color:var(--gold-2,#F7DFA3);font-weight:600;margin-right:6px}
  .bg-rpod{font-size:13px;color:var(--muted,#B69C9F);white-space:nowrap}
  @media (max-width:640px){
    .bg-row{grid-template-columns:52px minmax(0,1fr) 50px minmax(0,1fr);font-size:13.5px;gap:6px}
    .bg-extra{display:none}
    .bg-row .nm .f{display:none} .bg-row .nm .sh{display:inline}
    .bg-time{font-size:11.5px}
    .bg-row.race{grid-template-columns:52px minmax(0,1fr)}
    .bg-rpod{grid-column:2}
  }
  @media (prefers-reduced-motion:reduce){.bg-live i{animation:none}}`;
  function style() { if (document.getElementById('bg-css')) return; const s = document.createElement('style'); s.id = 'bg-css'; s.textContent = css; document.head.appendChild(s); }
  async function load() { const r = await fetch('api/fixtures', { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  return { card, row, load, style, dayKey, dayName, ICON, SPORT, esc };
})();

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const B = window.BigGames; B.style();
  let V = null, sport = 'all', timer = null;
  try { sport = sessionStorage.getItem('mc-bg-sport') || 'all'; } catch (e) {}
  function draw() {
    if (!V) return;
    const evs = V.events.filter(e => sport === 'all' || e.sport === sport);
    // sports chips with counts
    const counts = {}; V.events.forEach(e => { counts[e.sport] = (counts[e.sport] || 0) + 1; });
    const sports = Object.keys(B.SPORT).filter(s => counts[s]);
    if (sport !== 'all' && !counts[sport]) sport = 'all';
    $('chips').innerHTML = `<button type="button" data-s="all" aria-pressed="${sport === 'all'}">All sports<small>${V.events.length}</small></button>` +
      sports.map(s => `<button type="button" data-s="${s}" aria-pressed="${sport === s}">${B.ICON[s]} ${B.SPORT[s]}<small>${counts[s]}</small></button>`).join('');
    $('chips').querySelectorAll('button').forEach(b => { b.onclick = () => { sport = b.dataset.s; try { sessionStorage.setItem('mc-bg-sport', sport); } catch (e) {} draw(); }; });
    const feat = V.featured.filter(e => sport === 'all' || e.sport === sport);
    $('rail').innerHTML = feat.map(B.card).join(''); $('rail').hidden = !feat.length;
    // the schedule, one day at a time, each league together
    const days = new Map();
    for (const e of evs) { const k = B.dayKey(e.start); if (!days.has(k)) days.set(k, []); days.get(k).push(e); }
    $('list').innerHTML = [...days.values()].map(list => {
      const lgs = new Map(); list.forEach(e => { if (!lgs.has(e.league)) lgs.set(e.league, []); lgs.get(e.league).push(e); });
      return `<section class="day"><h3>${B.dayName(list[0].start)}</h3>${[...lgs.entries()].map(([name, es]) => `<div class="lg"><h4>${B.ICON[es[0].sport] || ''} ${B.esc(name)}</h4><ul>${es.map(B.row).join('')}</ul></div>`).join('')}</section>`;
    }).join('');
    $('empty').hidden = evs.length > 0;
    $('empty').textContent = V.ok ? 'No games on the schedule for this sport in the next week.' : 'The schedule is loading. Check back in a minute.';
    $('upd').textContent = V.updated ? 'Updated ' + new Date(V.updated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  }
  async function load() {
    try { V = await B.load(); draw(); } catch (e) { $('empty').hidden = false; $('empty').textContent = 'Couldn’t load the schedule. Check your connection.'; }
    clearTimeout(timer);
    const live = V && V.events.some(e => e.state === 'in');
    timer = setTimeout(() => { if (!document.hidden) load(); else timer = setTimeout(load, 30000); }, live ? 30000 : 120000);
  }
  load();
  setInterval(() => { if (V) draw(); }, 60000);   // keeps "in 12 min" counting down
})();
</script>
