<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynamite Diggers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0B0A12; --night-2:#15121F; --wood:#6B4423; --wood-2:#4A2D15; --wood-3:#2C1A0C; --iron:#3B3F46;
  --gold:#F4C74F; --gold-2:#FFE59A; --gold-3:#C98A1B; --ember:#FF7A2F; --red:#D8322E; --text:#F6EEDD; --muted:#B9A98F;
  --panel:#17120E; --panel-2:#221A13; --edge:rgba(255,229,154,.14);
  --grand:#FF4E3A; --major:#B26BFF; --minor:#3FB6FF; --mini:#4BD48A;
  --display:"Rye","Georgia",serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cell:min(calc((100vw - 56px) / 5), calc((100dvh - 330px) / 3.25), 152px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--body);overflow:hidden;background:var(--night);-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);position:relative;isolation:isolate}
.sky{position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 60% at 50% 110%,#3A1E10 0%,transparent 60%),radial-gradient(70% 50% at 50% 0%,#1E1A34 0%,transparent 70%),linear-gradient(180deg,#0E0C1A,#0B0A12 60%,#120B08);transition:filter .8s}
.sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.sky .stars{position:absolute;inset:0 0 50% 0;background-image:radial-gradient(1.2px 1.2px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 30% 60%,#fff6,transparent),radial-gradient(1.4px 1.4px at 70% 30%,#fff9,transparent),radial-gradient(1px 1px at 85% 70%,#fff5,transparent),radial-gradient(1.2px 1.2px at 55% 12%,#fff7,transparent),radial-gradient(1px 1px at 20% 80%,#fff4,transparent),radial-gradient(1px 1px at 92% 18%,#fff6,transparent)}
body.fs .sky{filter:hue-rotate(-25deg) saturate(1.4) brightness(1.15)}
body.hb .sky{filter:hue-rotate(15deg) saturate(1.6) brightness(.9)}

.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,rgba(20,14,10,.95),rgba(14,10,8,.85));border-bottom:1px solid var(--edge)}
.title{font:400 24px/1 var(--display);color:var(--gold-2);letter-spacing:.02em;text-shadow:0 2px 0 #7A3D0C,0 0 18px rgba(255,180,60,.35);white-space:nowrap}
.bar .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--edge);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off{color:var(--muted)}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px 8px;min-height:0}
.jps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:calc(var(--cell) * 5 + 32px);max-width:100%}
.jp{position:relative;border-radius:12px;padding:6px 8px 7px;text-align:center;background:linear-gradient(180deg,#2A1D12,#150E08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1.5px var(--c),0 6px 16px rgba(0,0,0,.5);overflow:hidden}
.jp::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 90% at 50% 0%,var(--c),transparent 70%);opacity:.22}
.jp span{position:relative;display:block;font:400 clamp(11px,1.4vw,14px)/1 var(--display);color:var(--c);letter-spacing:.08em}
.jp b{position:relative;display:block;margin-top:4px;font:700 clamp(13px,1.8vw,19px)/1 var(--mono);color:#FFF6DF;font-variant-numeric:tabular-nums}
.jp.grand{--c:var(--grand)} .jp.major{--c:var(--major)} .jp.minor{--c:var(--minor)} .jp.mini{--c:var(--mini)}
.jp.hit{animation:jpHit .5s ease 6 alternate}
@keyframes jpHit{to{transform:scale(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px var(--c),0 0 30px var(--c)}}

.machine{position:relative;padding:16px 16px 14px;border-radius:18px;
  background:linear-gradient(90deg,var(--wood-2),var(--wood) 12%,#7C5129 50%,var(--wood) 88%,var(--wood-2));
  box-shadow:inset 0 2px 0 rgba(255,220,160,.25),inset 0 -4px 10px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.7),0 0 0 2px #1A0F06}
.machine::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.35;mix-blend-mode:multiply;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(40,20,5,.5) 23px,transparent 24px 60px),repeating-linear-gradient(0deg,transparent 0 7px,rgba(60,30,8,.18) 8px,transparent 9px 17px)}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C9CDD3,#5A5F66 60%,#2A2D31);box-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
.lantern{position:absolute;top:-30px;width:34px;height:52px;z-index:3;pointer-events:none}
.lantern.l{left:-12px} .lantern.r{right:-12px}
.lantern .glow{position:absolute;left:50%;top:60%;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,180,70,.45),transparent 65%);animation:flicker 3s infinite;mix-blend-mode:screen}
@keyframes flicker{0%,100%{opacity:.9}20%{opacity:.7}40%{opacity:1}60%{opacity:.75}80%{opacity:.95}}
.window{position:relative;display:grid;grid-template-columns:repeat(5,var(--cell));gap:0;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#0C0A10,#1A1520 50%,#0C0A10);box-shadow:inset 0 0 0 3px #1A0F06,inset 0 10px 24px rgba(0,0,0,.9),inset 0 -10px 24px rgba(0,0,0,.9)}
.reel{position:relative;height:calc(var(--cell) * 3);overflow:hidden}
.reel + .reel{box-shadow:inset 1px 0 0 rgba(255,229,154,.07)}
.reel.antic{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 40px rgba(255,190,60,.55)}
.reel.antic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,200,80,.15),transparent);animation:sweep .5s linear infinite;pointer-events:none}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{position:relative;width:var(--cell);height:var(--cell);display:grid;place-items:center}
.sym{position:relative;width:88%;height:88%;display:grid;place-items:center;transition:filter .25s,opacity .25s,transform .25s}
.sym svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.blur .sym{filter:blur(1.4px)}
.lbl{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font:700 calc(var(--cell) * .15)/1 var(--mono);color:#3A1E00;background:linear-gradient(180deg,#FFF3C4,#F6C548);padding:3px 6px;border-radius:7px;box-shadow:0 2px 0 #9A6410,0 3px 6px rgba(0,0,0,.5);white-space:nowrap;letter-spacing:-.02em}
.lbl.jp{font:400 calc(var(--cell) * .13)/1 var(--display);color:#fff;letter-spacing:.05em;background:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px var(--c)}
.lbl.jp.MINI{--c:#1F9E5E} .lbl.jp.MINOR{--c:#1E7FC4} .lbl.jp.MAJOR{--c:#7B3BD0} .lbl.jp.GRAND{--c:#D92E1F}
.mult{position:absolute;right:6%;top:6%;font:400 calc(var(--cell) * .2)/1 var(--display);color:#fff;background:radial-gradient(circle at 40% 35%,#FF8E3C,#C0200F);width:calc(var(--cell) * .36);height:calc(var(--cell) * .36);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px #FFE59A,0 0 14px rgba(255,120,40,.8)}
.window.showing .sym{filter:brightness(.4) saturate(.6)}
.window.showing .cell.win .sym{filter:none;animation:pulse .7s ease-in-out infinite alternate}
.cell.win::before{content:"";position:absolute;inset:4%;border-radius:12px;box-shadow:0 0 0 2px var(--gold-2),0 0 22px rgba(255,210,90,.75);animation:glow .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.cell.land .sym{animation:land .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:scale(.6)}to{transform:none}}
.boom{position:absolute;z-index:8;width:calc(var(--cell) * 1.6);height:calc(var(--cell) * 1.6);transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,#FFF6C8 0%,#FFC74A 22%,#FF6A1F 45%,rgba(160,30,10,.5) 62%,transparent 72%);animation:boom .6s ease-out forwards}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.1);opacity:1}70%{opacity:1}to{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.spark{position:absolute;z-index:9;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff,#FFD54A 40%,#FF6A1F 70%,transparent 72%);box-shadow:0 0 16px #FFB030;transform:translate(-50%,-50%);pointer-events:none}
.coin{position:fixed;z-index:60;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C74F 45%,#B07A10);box-shadow:0 0 10px rgba(255,200,60,.8);pointer-events:none;transform:translate(-50%,-50%)}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}

/* hold & blast grid (sits over the reels) */
.hbgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(3,var(--cell));z-index:5;background:#0C0910}
.hbc{position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,229,154,.08)}
.hbc.empty::before{content:"";width:62%;height:62%;border-radius:50%;background:radial-gradient(circle,#231A28,#100C14);box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 0 0 1px rgba(255,229,154,.08)}
.hbc.spin::before{animation:hbspin .12s linear infinite}
@keyframes hbspin{0%{transform:translateY(-10%);filter:brightness(1.8)}100%{transform:translateY(10%)}}
.hbc.lock{background:radial-gradient(circle,rgba(255,190,60,.18),transparent 70%)}
.hbc.hot{animation:hot .5s ease 2}
@keyframes hot{50%{transform:scale(1.15);filter:brightness(1.6)}}
.hbc.count{box-shadow:inset 0 0 0 3px var(--gold-2),inset 0 0 30px rgba(255,210,90,.5)}
.hbbar{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:#170F09;box-shadow:0 0 0 1.5px var(--gold),0 8px 20px rgba(0,0,0,.6);z-index:6;white-space:nowrap}
.hbbar span{font:400 14px var(--display);color:var(--gold-2);letter-spacing:.05em}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#3A2B1C;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.dots i.on{background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C74F 50%,#B07A10);box-shadow:0 0 10px rgba(255,200,60,.8)}

.caption{min-height:26px;font:700 14.5px var(--body);color:var(--gold-2);text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.9);max-width:92vw}
.caption b{font-family:var(--mono)}
.fsbar{display:flex;gap:18px;align-items:center;padding:6px 16px;border-radius:999px;background:rgba(10,6,4,.8);box-shadow:0 0 0 1.5px var(--ember);font:700 14px var(--body)}
.fsbar b{font:400 17px var(--display);color:var(--gold-2)}

/* ---------- controls ---------- */
.dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,17,12,.96),rgba(12,9,7,.98));border-top:1px solid var(--edge)}
.meters{display:flex;gap:18px;align-items:center}
.mt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.mt span{font:800 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mt b{font:700 19px var(--mono);color:#FFF4D6;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt.win b{color:var(--gold)}
.bet{display:flex;align-items:center;gap:8px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--panel-2);font:800 20px/1 var(--body);cursor:pointer;display:grid;place-items:center}
.round:disabled,.pill:disabled{opacity:.35;cursor:not-allowed}
.spin{position:relative;width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 40% 30%,#FFE38A,#F4B32A 45%,#B96A0A 80%);box-shadow:0 0 0 4px #3A230E,0 0 0 6px #C98A1B,0 10px 24px rgba(0,0,0,.6),inset 0 -6px 10px rgba(120,60,0,.5);display:grid;place-items:center;transition:transform .1s}
.spin:active{transform:scale(.95)}
.spin svg{width:40px;height:40px;fill:none;stroke:#4A2500;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
.spin.go svg{animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spin .n{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--mono);color:#4A2500}
.spin:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.side{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid var(--edge);background:var(--panel-2);font:700 13px var(--body);cursor:pointer;white-space:nowrap}
.pill.on{background:#3B2A10;border-color:var(--gold);color:var(--gold-2)}
.pill.buy{background:linear-gradient(180deg,#D8322E,#8E1512);border-color:#FF8A6A;color:#FFF1E6}
.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(6,4,3,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ovc{text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.ovc h2{margin:0;font:400 clamp(40px,9vw,92px)/1 var(--display);color:var(--gold-2);text-shadow:0 4px 0 #7A3D0C,0 0 40px rgba(255,180,60,.6)}
.ovc h2.big{color:#FFE59A} .ovc h2.mega{color:#FF9F43} .ovc h2.epic{color:#FF5A4E} .ovc h2.jp{font-size:clamp(34px,7vw,70px)}
.ovc .amt{margin-top:12px;font:700 clamp(34px,7vw,64px)/1 var(--mono);color:#fff;text-shadow:0 0 30px rgba(255,210,90,.8)}
.ovc p{margin:14px auto 0;font:600 16px/1.5 var(--body);color:var(--text);max-width:34ch}
.ovc .tap{margin-top:18px;font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card{width:min(560px,100%);max-height:88dvh;overflow:auto;text-align:left;background:#1A130D;border:1px solid var(--edge);border-radius:18px;padding:22px 22px 18px;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:pop .3s ease;user-select:text}
.card h3{margin:0 0 10px;font:400 26px var(--display);color:var(--gold-2)}
.card h4{margin:18px 0 8px;font:800 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card p,.card li{font-size:14px;line-height:1.55;color:var(--text)}
.card ul{padding-left:18px;margin:6px 0}
.pays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pay{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04)}
.pay .ic{width:48px;height:48px;flex:none}
.pay .ic svg{width:100%;height:100%}
.pay div{font:600 12.5px/1.5 var(--mono)}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--edge);background:var(--panel-2);font:800 14px var(--body);cursor:pointer}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#3A1E00;border:0}
.autos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);z-index:70;padding:10px 16px;border-radius:12px;background:rgba(15,10,7,.92);box-shadow:0 0 0 1px var(--edge);font:700 14px var(--body);opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:90vw}
.toast.show{opacity:1}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

@media (max-width:760px){
  :root{--cell:min(calc((100vw - 48px) / 5), calc((100dvh - 380px) / 3.3), 150px)}
  .bar{gap:8px;padding:8px 12px}
  .rightcol{display:contents!important}
  .jps{gap:5px} .jp{padding:5px 4px 6px}
  .machine{padding:10px 8px 8px}
  .lantern{display:none}
  .dock{grid-template-columns:1fr auto;grid-template-areas:"m s" "b s" "x x";gap:8px 12px;padding-top:8px}
  .meters{grid-area:m;gap:14px} .spinwrap{grid-area:s} .bet{grid-area:b} .side{grid-area:x;justify-content:center}
  .spin{width:74px;height:74px}
  .spinwrap{justify-self:end}
  .bet{justify-self:start}
  .mt b{font-size:16px}
  .title{font-size:17px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pays{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.lantern .glow,.reel.antic::after{animation:none}}
.lobbylink{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(232,193,112,.45);color:#F7DFA3;text-decoration:none;font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;flex:none;background:rgba(0,0,0,.2)}
.lobbylink:hover{background:rgba(232,193,112,.14)}
.lobbylink svg{width:15px;height:15px}
@media (max-width:640px){.lobbylink span{display:none}.lobbylink{padding:0 9px}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div>
  <svg viewBox="0 0 1200 400" preserveAspectRatio="none"><path d="M0 400V250l120-90 90 60 140-140 120 110 80-50 150 130 110-90 140 100 120-80 130 90v110z" fill="#1A1210"/><path d="M0 400V310l160-60 140 50 180-90 170 80 150-40 170 70 230-60v140z" fill="#120C09"/></svg>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".45" stop-color="#F4C74F"/><stop offset="1" stop-color="#A86A0C"/></linearGradient>
    <linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEB7A"/><stop offset="1" stop-color="#F29C12"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E1512"/><stop offset=".45" stop-color="#E4413A"/><stop offset="1" stop-color="#8E1512"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A2D15"/><stop offset=".5" stop-color="#8A5A2E"/><stop offset="1" stop-color="#4A2D15"/></linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7EBF0"/><stop offset=".5" stop-color="#8D949D"/><stop offset="1" stop-color="#4B5057"/></linearGradient>
    <radialGradient id="gFlame" cx=".5" cy=".6" r=".5"><stop offset="0" stop-color="#FFFBE0"/><stop offset=".4" stop-color="#FFD24A"/><stop offset="1" stop-color="#FF7A1F" stop-opacity="0"/></radialGradient>

<script>
/* Miguel's Casino (online): the casino's server keeps every bankroll and decides every game.
   This page only shows a copy of your balance and sends your moves. */
window.CASINO_ONLINE = true;
window.CasinoNet = (() => {
  const SEAT_KEY = 'miguels-casino-seat';
  function seat() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SEAT_KEY)); } catch (e) {}
    if (!s || !s.id || !s.token) {
      const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
      s = { id: 'p-' + hex(12), token: hex(24) };
      try { localStorage.setItem(SEAT_KEY, JSON.stringify(s)); } catch (e) {}
    }
    return s;
  }
  // POST to the casino with this browser's seat; returns { ok, status, body }
  async function api(path, body = {}) {
    const s = seat();
    let r, j = {};
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: s.id, token: s.token }, body)) });
        j = await r.json().catch(() => ({}));
        if (r.status === 429 && attempt < 2) { await new Promise(res => setTimeout(res, 700 * (attempt + 1))); continue; }
        if (r.status === 503 && /opening/i.test(j.error || '') && attempt < 2) { await new Promise(res => setTimeout(res, 2500)); continue; }
        break;
      } catch (e) {
        if (attempt === 2) return { ok: false, status: 0, body: { error: 'No connection to the casino. Check your internet and try again.' } };
        await new Promise(res => setTimeout(res, 800));
      }
    }
    if (typeof j.cents === 'number') CasinoWallet._server(j.cents);
    if (r.status === 403 && /suspended/i.test(j.error || '')) CasinoUI.suspended();
    return { ok: r.ok, status: r.status, body: j };
  }
  return { seat, api };
})();

window.CasinoWallet = (() => {
  const START = 100000, CACHE = 'miguels-casino-cache';
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
  const mine = cache && cache.id === CasinoNet.seat().id;
  let bal = mine && Number.isFinite(cache.cents) ? cache.cents : 0;
  let info_ = { peak: mine ? cache.peak || 0 : 0, resets: mine ? cache.resets || 0 : 0 };
  let view = null, onExternal = null, isBusy = () => false;
  const listeners = [];
  const cents = () => bal;
  function bind(v, ext, busy) { view = v; onExternal = ext; if (busy) isBusy = busy; }
  function remember() { try { localStorage.setItem(CACHE, JSON.stringify({ id: CasinoNet.seat().id, cents: bal, peak: info_.peak, resets: info_.resets })); } catch (e) {} }
  // the server just told us the balance
  function _server(c) { bal = c; remember(); listeners.forEach(f => { try { f(c); } catch (e) {} }); }
  // move this page's own balance to match the server (only while nothing is in play)
  function apply(c) {
    if (view && onExternal) { const d = c - view(); if (d) onExternal(d); }
    _server(c);
  }
  async function refresh() {
    if (isBusy()) return null;
    const r = await CasinoNet.api('api/me', { name: CasinoBoard.name() });
    if (r.ok) { info_ = { peak: r.body.peak, resets: r.body.resets }; if (!isBusy()) apply(r.body.cents); CasinoUI.notice(r.body.notice); if (r.body.banned) CasinoUI.suspended(); }
    return r.ok ? r.body : null;
  }
  // a fresh $1,000, only when you are out of chips everywhere
  async function reset() {
    const r = await CasinoNet.api('api/wallet/reset');
    if (r.ok) { info_.resets = r.body.resets; apply(r.body.cents); }
    return r;
  }
  const info = () => ({ cents: bal, peak: Math.max(info_.peak || 0, bal), resets: info_.resets || 0 });
  const onChange = f => listeners.push(f);
  let last = 0;
  const maybeRefresh = () => { if (Date.now() - last > 4000) { last = Date.now(); refresh(); } };
  addEventListener('focus', maybeRefresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) maybeRefresh(); });
  // money only moves on the server now, so these do nothing
  const sync = () => {}, pull = () => {}, add = () => {}, noteReset = () => {};
  return { cents, bind, sync, pull, add, noteReset, info, refresh, reset, apply, onChange, _server, START };
})();

window.CasinoBoard = (() => {
  const NAME_KEY = 'miguels-casino-name';
  let ready = null, mode = null, denied = false, meInfo = null, timer = null;
  function name() { try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; } }
  function setName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} push(); }
  function connect() {
    if (ready) return ready;
    ready = (async () => {
      if (!/^https?:$/.test(location.protocol)) return false;
      const r = await CasinoNet.api('api/me', { name: name() });
      if (!r.ok) { if (r.status === 403) { denied = true; mode = 'server'; return true; } ready = null; return false; }
      meInfo = r.body; mode = 'server';
      CasinoWallet.apply(r.body.cents);
      CasinoUI.notice(r.body.notice);
      if (r.body.banned) CasinoUI.suspended();
      if (r.body.name && !name()) { try { localStorage.setItem(NAME_KEY, r.body.name); } catch (e) {} }
      return true;
    })().catch(() => { ready = null; return false; });
    return ready;
  }
  async function push() {
    if (!(await connect())) return false;
    const r = await CasinoNet.api('api/me', { name: name() });
    if (r.ok) meInfo = r.body;
    return r.ok;
  }
  function schedule(ms = 2500) { clearTimeout(timer); timer = setTimeout(push, ms); }
  function subscribe(onRows, onError) {
    let es = null, poll = null;
    const load = () => fetch('api/players', { cache: 'no-store' }).then(r => r.json()).then(onRows).catch(() => {});
    if (window.EventSource) {
      es = new EventSource('api/stream');
      es.addEventListener('players', e => { try { onRows(JSON.parse(e.data)); } catch (x) {} });
      es.addEventListener('notice', e => { try { CasinoUI.notice(JSON.parse(e.data)); } catch (x) {} });
      es.onerror = () => { if (onError && es.readyState === 2) onError(); };
    } else { load(); poll = setInterval(load, 8000); }
    return () => { if (es) es.close(); if (poll) clearInterval(poll); };
  }
  const identity = () => CasinoNet.seat();
  const snapshot = () => null;
  return { name, setName, connect, push, schedule, snapshot, subscribe, identity, get uid() { return CasinoNet.seat().id; }, get mode() { return mode; }, get denied() { return denied; }, get me() { return meInfo; } };
})();

// announcements from the casino, and the notice for a suspended account
window.CasinoUI = (() => {
  let bar = null, shownKey = '';
  const css = `.mc-notice{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;max-width:min(680px,calc(100% - 24px));display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:14px;
    font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1B1206;background:linear-gradient(180deg,#FFE9A8,#F2C65A);box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);animation:mcIn .35s ease}
    .mc-notice.party{background:linear-gradient(90deg,#FF9AD5,#FFD36E,#8EF0B4);} .mc-notice.warn{background:linear-gradient(180deg,#FFB4A8,#F2786D);}
    .mc-notice.ban{background:linear-gradient(180deg,#3A1414,#220A0A);color:#FFD9D2;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px #F2786D}
    .mc-notice b{font-weight:800}
    .mc-notice button{flex:none;border:0;background:rgba(0,0,0,.14);color:inherit;width:26px;height:26px;border-radius:50%;cursor:pointer;font:700 15px system-ui}
    @keyframes mcIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}`;
  function ensure() {
    if (bar) return bar;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    bar = document.createElement('div'); bar.className = 'mc-notice'; bar.hidden = true; bar.setAttribute('role', 'status');
    document.body.appendChild(bar);
    return bar;
  }
  function show(text, kind, closable) {
    const b = ensure();
    b.className = 'mc-notice ' + (kind || '');
    b.textContent = '';
    const s = document.createElement('span'); s.textContent = text; b.appendChild(s);
    if (closable) { const x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.textContent = '×'; x.onclick = () => { b.hidden = true; try { sessionStorage.setItem('mc-notice-closed', shownKey); } catch (e) {} }; b.appendChild(x); }
    b.hidden = false;
  }
  let banned = false;
  function notice(n) {
    if (banned) return;
    if (!document.body) { addEventListener('DOMContentLoaded', () => notice(n)); return; }
    if (!n || !n.text) { if (bar && !banned) bar.hidden = true; return; }
    shownKey = String(n.t || n.text);
    let closed = ''; try { closed = sessionStorage.getItem('mc-notice-closed') || ''; } catch (e) {}
    if (closed === shownKey) return;
    show('📣 ' + n.text, n.kind === 'party' ? 'party' : n.kind === 'warn' ? 'warn' : '', true);
  }
  function suspended() {
    banned = true;
    if (!document.body) { addEventListener('DOMContentLoaded', suspended); return; }
    show('Your account has been suspended by the casino, so you can’t play right now. Ask Miguel if you think this is a mistake.', 'ban', false);
  }

<script>
/* Dynamite Diggers: game math. Pure functions, all amounts in multiples of the total bet. */
const SlotEngine = (() => {
  const REELS = 5, ROWS = 3;

    A: [9, 9, 9, 9, 9], K: [9, 9, 9, 9, 9], Q: [10, 10, 10, 10, 10], J: [10, 10, 10, 10, 10],
    WILD: [0, 2.6, 2.6, 2.6, 2.6], SCAT: [3.3, 0, 3.3, 0, 3.3], NUG: [9.3, 9.3, 9.3, 9.3, 9.3], CART: [0, 0, 0, 0, 0.95],

  }

})();

    $('caption').innerHTML = s.wins.length === 1 ? winText(s.wins[0]) : `${s.wins.length} wins · <b>${money(cents(lineSum))}</b>`;
    await wait(s.wins.length > 1 ? 900 : 1000);
    if (s.wins.length > 1 && !S.turbo && !S.auto) for (const w of s.wins.slice(0, 4)) { highlight(w.cells); $('caption').innerHTML = winText(w); await wait(700); }
  }
  if (s.collect) {
    highlight([...s.collect.cells, ...s.collect.carts]);
    $('caption').innerHTML = 'Mine cart collects the gold!';
    await flyCoins(s.collect.cells.map(([r, row]) => cellEl(r, row)), cellEl(...s.collect.carts[0]));
    runTotal += s.collect.amount;
    setWin(cents(runTotal));
    $('caption').innerHTML = `Mine cart collects <b>${money(cents(s.collect.amount))}</b>`;
    await wait(1000);
  }
  highlight(null);
  return runTotal;
}

/* ---------- overlays ---------- */
function overlay(html, ms, cls = '') {
  const ov = $('ov');
  ov.innerHTML = `<div class="ovc ${cls}">${html}<div class="tap">Tap to continue</div></div>`;
  ov.hidden = false;
  return new Promise(res => {
    let done = false;
    const close = () => { if (done) return; done = true; ov.hidden = true; ov.onclick = null; res(); };
    ov.onclick = close;
    setTimeout(close, (S.auto ? Math.min(ms, 2200) : ms) * (S.turbo ? .6 : 1));
  });
}
function countUp(el, to, ms) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); el.textContent = money(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); else res(); };
    step();
  });
}
// coin shower
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [], fxOn = false;
function shower(n) {
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio;
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * fx.width, y: -Math.random() * fx.height * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 6, r: (6 + Math.random() * 8) * devicePixelRatio, a: Math.random() * 6, va: .1 + Math.random() * .2 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
}
function drawFx() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.y < fx.height + 40);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.a += p.va;
    const w = Math.abs(Math.cos(p.a)) * p.r;
    ctx.fillStyle = '#B07A10'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w + 1.5, p.r + 1.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#F4C74F'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w, p.r, 0, 0, 7); ctx.fill();
  }
  if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, fx.width, fx.height); }
}
async function bigWin(c) {
  const x = c / bet();
  if (x < 15) return;
  const [cls, label] = x >= 100 ? ['epic', 'EPIC WIN'] : x >= 40 ? ['mega', 'MEGA WIN'] : ['big', 'BIG WIN'];
  sfx('big'); shower(x >= 100 ? 220 : x >= 40 ? 140 : 80);
  const ov = $('ov');
  ov.innerHTML = `<div class="ovc"><h2 class="${cls}">${label}</h2><div class="amt" id="bwAmt">$0</div><div class="tap">Tap to continue</div></div>`;
  ov.hidden = false;
  let skip = false;
  await new Promise(res => {
    ov.onclick = () => { skip = true; res(); };
    countUp($('bwAmt'), c, S.turbo ? 1200 : 2600).then(() => setTimeout(res, S.auto ? 1200 : 2400));
  });
  $('bwAmt') && ($('bwAmt').textContent = money(c));
  ov.hidden = true; ov.onclick = null;
}

/* ---------- Hold & Blast ---------- */
async function holdAndBlast(startGrid, hb, runTotal) {
  S.stats.features++;
  sfx('feature');
  document.body.classList.add('hb');
  await overlay(`<h2>Hold &amp; Blast</h2><p>Gold nuggets lock in place. Three respins, and every new landing resets them. Dynamite doubles everything. Mine carts collect it all. Fill the screen for the <b style="color:var(--grand)">GRAND</b>.</p>`, 4200);
  const grid = document.createElement('div'); grid.className = 'hbgrid';
  const bar = document.createElement('div'); bar.className = 'hbbar'; bar.innerHTML = '<span>Respins</span><div class="dots"><i></i><i></i><i></i></div>';
  $('win').appendChild(grid); $('machine').appendChild(bar);
  const cells = [];
  for (let row = 0; row < E.ROWS; row++) for (let r = 0; r < E.REELS; r++) { const c = document.createElement('div'); c.className = 'hbc empty'; c.style.gridColumn = r + 1; c.style.gridRow = row + 1; grid.appendChild(c); cells[r * E.ROWS + row] = c; }
  const draw = (i, v) => {
    const c = cells[i];
    if (!v) { c.className = 'hbc empty'; c.innerHTML = ''; return; }
    c.className = 'hbc lock';
    if (v.kind === 'tnt') c.innerHTML = symHTML({ sym: 'TNT' });
    else if (v.kind === 'cart') c.innerHTML = `<div class="sym"><svg viewBox="0 0 100 100"><use href="#s-CART"/></svg>${v.v > 0 ? `<span class="lbl" style="bottom:22%">${money(cents(v.v))}</span>` : ''}</div>`;
    else c.innerHTML = symHTML({ sym: 'NUG', v: v.v, jp: v.jp });
  };
  const dots = n => bar.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k < n));
  hb.start.forEach((v, i) => draw(i, v));
  dots(3);
  await wait(900);
  for (const st of hb.steps) {
    const empties = cells.map((c, i) => (c.classList.contains('empty') ? i : -1)).filter(i => i >= 0);
    empties.forEach(i => cells[i].classList.add('spin'));
    sfx('respin');
    await wait(420);
    // land one column at a time for suspense
    for (let r = 0; r < E.REELS; r++) {
      let hit = false;
      for (let row = 0; row < E.ROWS; row++) {
        const i = r * E.ROWS + row;
        if (!empties.includes(i)) continue;
        cells[i].classList.remove('spin');
        if (st.landed.includes(i)) {
          draw(i, st.pre[i]); cells[i].classList.add('hot'); hit = true; sfx('nug', row);
        }
      }
      if (hit) await wait(160); else await wait(60);
    }
    // dynamite and carts
    for (const ev of st.events) {
      await wait(350);
      if (ev.type === 'tnt') {
        boomAt(cells[ev.at]); sfx('boom'); shake();
        $('caption').innerHTML = 'Dynamite! Every value doubles!';
        await wait(300);
        ev.hit.forEach(j => { draw(j, ev.after[j]); cells[j].classList.add('hot'); });
      } else {
        $('caption').innerHTML = 'Mine cart collects everything showing!';
        await flyCoins(ev.from.map(j => cells[j]), cells[ev.at]);
        draw(ev.at, ev.after[ev.at]); cells[ev.at].classList.add('hot');
      }
      await wait(400);
    }
    st.cells.forEach((v, i) => { if (v) draw(i, v); });
    dots(st.left);
    $('caption').innerHTML = st.landed.length ? 'Respins reset to 3!' : st.left ? `${st.left} respin${st.left > 1 ? 's' : ''} left` : '';
    await wait(st.landed.length ? 700 : 450);
  }
  // count it up
  $('caption').innerHTML = 'Counting the gold…';
  let sub = 0;
  for (let i = 0; i < hb.cells.length; i++) {
    const i2 = (i % E.REELS) * E.ROWS + Math.floor(i / E.REELS); // left to right, row by row
    const v = hb.cells[i2];
    if (!v || !v.v) continue;
    cells[i2].classList.add('count');
    sub += v.v; setWin(cents(runTotal + sub));
    if (v.jp) { const j = document.querySelector(`.jps .jp[data-jp="${v.jp}"]`); j.classList.remove('hit'); void j.offsetWidth; j.classList.add('hit'); sfx('big'); await wait(900); }
    else { sfx('coin'); await wait(170); }
    cells[i2].classList.remove('count');
  }
  if (hb.full) {
    S.stats.grands++;
    const j = document.querySelector('.jps .jp[data-jp="GRAND"]'); j.classList.add('hit');
    shower(260); sfx('big');
    await overlay(`<h2 class="jp" style="color:var(--grand)">GRAND JACKPOT</h2><div class="amt">${money(cents(E.JACKPOTS.GRAND))}</div><p>You filled every spot on the reels.</p>`, 5000);
    sub += E.JACKPOTS.GRAND; setWin(cents(runTotal + sub));
  }
  await overlay(`<h2 style="font-size:clamp(30px,6vw,54px)">Hold &amp; Blast pays</h2><div class="amt">${money(cents(hb.total))}</div>`, 3000);
  grid.remove(); bar.remove();
  document.body.classList.remove('hb');
  $('caption').innerHTML = '';
  return runTotal + hb.total;
}

/* ---------- one full play ---------- */
function plan(buy) {
  if (buy) { const g = E.boughtGrid(rng); const hb = E.holdBlast(rng, g); return { buy: true, grid: g, hb, total: hb.total }; }
  const s = E.spin(rng, false);
  let total = s.total;
  const hb = s.holdBlast ? E.holdBlast(rng, s.grid) : null;
  if (hb) total += hb.total;
  let fs = null;
  if (s.freeSpins) {
    fs = []; let left = E.FS_AWARD;
    while (left > 0 && fs.length < 200) {
      left--;
      const f = E.spin(rng, true);
      const fhb = f.holdBlast ? E.holdBlast(rng, f.grid) : null;
      total += f.total + (fhb ? fhb.total : 0);
      if (f.freeSpins) left += E.FS_AWARD;
      fs.push({ s: f, hb: fhb });
    }
  }
  return { s, hb, fs, total };
}
async function play(buy) {
  if (S.busy) { hurry(); return; }
  const cost = buy ? cents(E.BUY_PRICE) : bet();
  if (S.bank < cost) { S.auto = 0; renderMeters(); toast(S.bank < bet() ? 'Not enough in your bankroll. Top up in the lobby.' : 'Lower your bet to keep playing.'); return; }
  S.busy = true; S.hurry = false;
  S.bank -= cost; S.ledger.cost += cost; CasinoWallet.sync();
  let p, payout, serverCents = null;
  if (window.CASINO_ONLINE) {
    // online: the casino's server takes the bet, spins and pays; this page shows the spin it was sent
    renderMeters();
    const R = await CasinoNet.api('api/g/slots', { bet: bet(), buy: !!buy });
    if (!R.ok) {
      S.bank += cost; S.ledger.cost -= cost; S.busy = false; S.auto = 0; renderMeters();
      toast(R.body.error || 'The machine could not spin. Try again.');
      return;
    }
    p = R.body.plan; payout = R.body.payout; serverCents = R.body.cents;
  } else {
    p = plan(buy);
    payout = cents(p.total);
    save({ pending: payout > 0 ? { c: payout, t: Date.now() } : null });
  }
  S.stats.spins++;
  shown = 0; setWin(0, true);
  renderMeters();
  $('caption').innerHTML = '';
  let run = 0;
  try {
    if (p.buy) {
      await spinTo(p.grid, false);
      run = await holdAndBlast(p.grid, p.hb, 0);
    } else {
      await spinTo(p.s.fuse ? p.s.before : p.s.grid, false);
      if (p.s.fuse) await fuseBlast(p.s.fuse, p.s.grid);
      if (p.s.freeSpins) { highlight(p.s.scatters); sfx('feature'); $('caption').innerHTML = 'Three bonus signs!'; await wait(1300); highlight(null); }
      run = await showWins(p.s, 0);
      if (p.hb) run = await holdAndBlast(p.s.grid, p.hb, run);
      if (p.fs) run = await freeSpins(p.fs, run);
    }
  } catch (e) { console.error(e); }
  // pay out exactly what was decided at the start
  S.bank += payout; S.ledger.paid += payout; CasinoWallet.sync();
  if (serverCents !== null) S.bank = serverCents;
  save({ pending: null });
  shown = payout; setWin(payout, true);
  S.stats.bigWin = Math.max(S.stats.bigWin, payout - cost);
  S.stats.bestMult = Math.max(S.stats.bestMult, Math.round(p.total * 10) / 10);
  save();
  S.hurry = false;
  try {
    if (payout >= bet() * 15) await bigWin(payout);
    else if (payout > 0 && !$('caption').innerHTML) $('caption').innerHTML = `You win <b>${money(payout)}</b>`;
  } catch (e) { console.error(e); $('ov').hidden = true; }
  S.busy = false;
  renderMeters();
  if (S.auto) {
    if (S.auto !== Infinity) S.auto--;
    if ((p.hb || p.fs || p.buy) && S.autoStopFeature) { S.auto = 0; toast('Autoplay stopped for the bonus'); }
    renderMeters();
    if (S.auto) setTimeout(() => { if (S.auto && !S.busy) play(false); }, S.turbo ? 120 : 380);
  }
}
async function freeSpins(list, run) {
  S.stats.features++;
  S.fs = true; document.body.classList.add('fs');
  await overlay(`<h2>${E.FS_AWARD} Free Spins</h2><p>Extra dynamite in the mine. Every wild carries a <b>×2</b> or <b>×3</b> multiplier, and multipliers multiply together.</p>`, 4000);
  const bar = document.createElement('div'); bar.className = 'fsbar';
  $('caption').before(bar);
  let total = E.FS_AWARD;
  const fsStart = run;
  for (let k = 0; k < list.length; k++) {
    const { s, hb } = list[k];
    bar.innerHTML = `<span>Free spin <b>${k + 1}</b> of <b>${total}</b></span><span>Won <b>${money(cents(run - fsStart))}</b></span>`;
    $('caption').innerHTML = '';
    await spinTo(s.fuse ? s.before : s.grid, true);
    if (s.fuse) await fuseBlast(s.fuse, s.grid);
    run = await showWins(s, run);
    if (hb) run = await holdAndBlast(s.grid, hb, run);
    if (s.freeSpins) { total += E.FS_AWARD; highlight(s.scatters); sfx('feature'); await overlay(`<h2>+${E.FS_AWARD} Spins</h2>`, 2000); highlight(null); }
    bar.innerHTML = `<span>Free spin <b>${k + 1}</b> of <b>${total}</b></span><span>Won <b>${money(cents(run - fsStart))}</b></span>`;
    await wait(350);
  }
  bar.remove();
  S.fs = false; document.body.classList.remove('fs');
  await overlay(`<h2 style="font-size:clamp(30px,6vw,54px)">Free spins pay</h2><div class="amt">${money(cents(run - fsStart))}</div>`, 3000);
  return run;
}

/* ---------- panels ---------- */
function paytable() {
  const b = bet();
  const rows = ['BIRD', 'HELM', 'LAMP', 'PICK', 'A', 'K', 'Q', 'J'].map(k => `<div class="pay"><div class="ic"><svg viewBox="0 0 100 100"><use href="#s-${k}"/></svg></div><div>5× ${money(Math.round(E.PAY[k][2] * b))}<br>4× ${money(Math.round(E.PAY[k][1] * b))}<br>3× ${money(Math.round(E.PAY[k][0] * b))}</div></div>`).join('');
  const ov = $('ov');
  ov.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="Paytable">
    <h3>How it pays</h3>
    <p>243 ways to win. Matching symbols pay left to right on neighbouring reels, anywhere in the column. Pays below are per way at your ${money(b)} bet.</p>
    <div class="pays">${rows}</div>
    <h4>Wild &amp; Fuse</h4>
    <ul><li><b>TNT Wild</b> lands on reels 2–5 and stands in for every paying symbol.</li><li><b>Fuse Blast</b>: at random the fuse lights and 2–5 symbols explode into wilds.</li></ul>
    <h4>Gold &amp; the mine cart</h4>
    <ul><li>Gold nuggets carry cash values or a MINI, MINOR or MAJOR jackpot.</li><li>A <b>mine cart</b> on reel 5 collects every nugget in view.</li></ul>
    <h4>Hold &amp; Blast</h4>
    <ul><li>6 or more nuggets start it. Nuggets lock, you get 3 respins, and anything new resets them to 3.</li><li><b>Dynamite ×2</b> doubles every cash value and cart on the screen.</li><li><b>Mine carts</b> collect every value showing.</li><li>Fill all 15 spots to win the <b>GRAND</b> (${money(Math.round(E.JACKPOTS.GRAND * b))}).</li><li>Buy it any time for ${E.BUY_PRICE}× your bet.</li></ul>
    <h4>Free spins</h4>
    <ul><li>3 bonus signs on reels 1, 3 and 5 give ${E.FS_AWARD} free spins; 3 more add another ${E.FS_AWARD}.</li><li>Wilds carry ×2 or ×3 and the fuse lights more often.</li></ul>
    <h4>Jackpots at this bet</h4>
    <p>Mini ${money(Math.round(15 * b))} · Minor ${money(Math.round(40 * b))} · Major ${money(Math.round(150 * b))} · Grand ${money(Math.round(1000 * b))}. Jackpots scale with your bet.</p>
    <p style="color:var(--muted)">Return to player about 96% over millions of spins. Every spin is decided the moment you press spin.</p>
    <div class="row"><button class="btn gold" id="close">Close</button></div></div>`;
  ov.hidden = false;
  const close = () => { ov.hidden = true; ov.onclick = null; };
  $('close').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
}
function autoMenu() {
  if (S.auto) { S.auto = 0; renderMeters(); return; }
  const ov = $('ov');
  ov.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="Autoplay"><h3>Autoplay</h3><p>Spins at ${money(bet())} each. Tap the spin button any time to stop.</p>
    <div class="autos">${[10, 25, 50, 100, '∞'].map(n => `<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px"><input type="checkbox" id="stopF" ${S.autoStopFeature !== false ? 'checked' : ''}> Stop when a bonus starts</label>
    <div class="row"><button class="btn" id="close">Cancel</button></div></div>`;
  ov.hidden = false;
  const close = () => { ov.hidden = true; ov.onclick = null; };
  $('close').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { S.autoStopFeature = $('stopF').checked; S.auto = b.dataset.n === '∞' ? Infinity : +b.dataset.n; close(); renderMeters(); play(false); });
}
function buyMenu() {
  if (S.busy) return;
  const c = cents(E.BUY_PRICE);
  const ov = $('ov');
  ov.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="Buy bonus" style="text-align:center"><h3>Buy Hold &amp; Blast</h3><p>Start the Hold &amp; Blast bonus right away with 6 gold nuggets locked on the reels.</p><div class="ovc" style="animation:none"><div class="amt" style="font-size:40px">${money(c)}</div></div><p style="color:var(--muted)">${E.BUY_PRICE}× your ${money(bet())} bet</p>
    <div class="row" style="justify-content:center"><button class="btn" id="close">Cancel</button><button class="btn gold" id="ok">Buy</button></div></div>`;
  ov.hidden = false;
  const close = () => { ov.hidden = true; ov.onclick = null; };
  $('close').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
  $('ok').onclick = () => { close(); play(true); };
}

/* ---------- wiring ---------- */
$('spinBtn').onclick = () => { unlock(); if (S.auto && !S.busy) { S.auto = 0; renderMeters(); return; } if (S.auto) { S.auto = 0; renderMeters(); hurry(); return; } play(false); };
$('betDown').onclick = () => { if (S.busy) return; S.betIx = Math.max(0, S.betIx - 1); save(); renderMeters(); refreshLabels(); };
$('betUp').onclick = () => { if (S.busy) return; S.betIx = Math.min(BETS.length - 1, S.betIx + 1); save(); renderMeters(); refreshLabels(); };
$('turboBtn').onclick = () => { S.turbo = !S.turbo; save(); renderMeters(); };
$('autoBtn').onclick = () => { unlock(); autoMenu(); };
$('buyBtn').onclick = () => { unlock(); buyMenu(); };
$('infoBtn').onclick = paytable;
$('soundBtn').onclick = () => { S.sound = !S.sound; unlock(); save(); renderMeters(); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && $('ov').hidden && !e.repeat && !['INPUT', 'BUTTON'].includes(e.target.tagName)) { e.preventDefault(); play(false); }
  else if (e.code === 'Space' && !$('ov').hidden && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('ov').click(); }
  if (e.key === 'Escape' && !$('ov').hidden && $('close')) $('close').click();
});
function refreshLabels() { if (S.grid && !S.busy) showGrid(S.grid); }
addEventListener('resize', () => { if (!S.busy && S.grid) showGrid(S.grid); });

buildReels();
let first; do { first = E.spin(rng, false); } while (first.total > 0 || first.fuse || first.holdBlast || first.freeSpins);
showGrid(first.grid);
renderMeters();
// a spin that was still animating when the page closed pays out now
const pend = window.CASINO_ONLINE ? null : load().pending;
if (window.CASINO_ONLINE) CasinoBoard.connect().then(ok => { if (!ok) toast('This machine needs the casino server to spin.'); });
if (pend && pend.c > 0) { S.bank += pend.c; CasinoWallet.sync(); save({ pending: null }); renderMeters(); setTimeout(() => toast(`Your last spin finished: ${money(pend.c)} added`), 400); }
if (document.fonts) document.fonts.ready.then(() => { if (!S.busy) showGrid(S.grid); });
window.__slot = { S, E, play, plan };
})();
